    beep('err'); status(T('hanoiNo'), 1400); C.x.sel = ENG.hanoi.top(C.S, p) >= 0 ? p : -1; R.draw(C);
  }
  return R;
})();

/* ================= Rotate (מסובב תמונה) ================= */
UI.rotate = (() => {
  const R = {
    start(C) { let k = ST.rotPic || 'kids'; if (k === 'mine' && !myPhotos().length) k = 'kids'; C.x.kind = k; C.x.pk = C.i + 7; C.x.ang = C.S.r.map(v => v * 90); },
    mount(C) { C.ui = { tiles: [] }; },
    layout(C, W, H) {
      const P = C.P, ts = Math.min(W / P.C, H / P.R, 130), G = C.ui.g = { ts, W: ts * P.C, H: ts * P.R };
      C.el.style.width = px(G.W); C.el.style.height = px(G.H); C.el.innerHTML = '';
      C.el.insertAdjacentHTML('afterbegin', '<div class="pz sl-bg" style="left:0;top:0;width:' + px(G.W) + ';height:' + px(G.H) + '"></div>');
      C.ui.tiles = [...Array(P.n).keys()].map(i => { const e = mk(C.el, 'rt-t'); place(e, (i % P.C) * G.ts + 1, ((i / P.C) | 0) * G.ts + 1, G.ts - 2, G.ts - 2); return e; });
      if (!C.x.ang || C.x.ang.length !== P.n) C.x.ang = C.S.r.map(v => v * 90);
      setPic(C);
      if (!C.ui.bound) { C.ui.bound = true; C.el.addEventListener('pointerdown', e => { if (C !== CUR || C.busy || C.over) return; const [x, y] = bpt(C, e), G2 = C.ui.g, c = Math.floor(x / G2.ts), r = Math.floor(y / G2.ts); if (c < 0 || r < 0 || c >= C.P.C || r >= C.P.R) return; doMove([r * C.P.C + c]); }); }
    },
    draw(C) {
      const P = C.P, G = C.ui.g; if (!G) return;
      // keep the turning direction: the shown angle only grows
      C.S.r.forEach((v, i) => { const want = v * 90; let a = C.x.ang[i]; while (((a % 360) + 360) % 360 !== want) a += 90; if (a - C.x.ang[i] >= 360) a -= 360; C.x.ang[i] = a; });
      C.ui.tiles.forEach((e, i) => {
        const gr = (i / P.C) | 0, gc = i % P.C;
        if (C.ui.url) { e.style.backgroundImage = 'url("' + C.ui.url + '")'; e.style.backgroundSize = px(G.bw) + ' ' + px(G.bh); e.style.backgroundPosition = px(-(gc * G.ts + G.ox) - 1) + ' ' + px(-(gr * G.ts + G.oy) - 1); }
        e.style.transform = 'rotate(' + C.x.ang[i] + 'deg)';
        e.classList.toggle('ok', !C.S.r[i]);
      });
    },
    async anim(C, prev, m) { beep('clink'); R.draw(C); await wait(160); if (ENG.rotate.won(C.S)) C.ui.tiles.forEach(e => e.classList.add('done')); },
    hintShow(C, m) { R.hintClear(C); C.ui.tiles[m[0]].classList.add('hint'); },
    hintClear(C) { if (C.ui && C.ui.tiles) C.ui.tiles.forEach(e => e.classList.remove('hint')); },
    pills(C) { return (C.P.linked ? '<span class="pill">🔗 ' + T('rotLinked') + '</span>' : '') + '<button class="pill pbtn" data-pk="peek">👁 ' + T('peek') + '</button>'; },
    pillTap(C, k) { if (k !== 'peek' || !C.ui.url) return; const G = C.ui.g, o = mk(C.el, 'sl-peek'); place(o, 0, 0, G.W, G.H); o.style.backgroundImage = 'url("' + C.ui.url + '")'; o.style.backgroundSize = px(G.bw) + ' ' + px(G.bh); o.style.backgroundPosition = px(-G.ox) + ' ' + px(-G.oy); setTimeout(() => o.remove(), FAST ? 0 : 1800); },
    intro(C) { if (C.i < 2) status(T('rotateGoal'), 2600); else if (C.P.linked && !C.hist.length) status(T('rotLinkedD'), 3200); }
  };
  function setPic(C) {
    const G = C.ui.g, url = picURL(C.x.kind, C.x.pk); C.ui.url = url;
    const fit = a => { const A = G.W / G.H; if (a > A) { G.bh = G.H; G.bw = G.H * a; } else { G.bw = G.W; G.bh = G.W / a; } G.ox = (G.bw - G.W) / 2; G.oy = (G.bh - G.H) / 2; };
    fit(.75);
    if (url && /\.webp$/.test(url)) { const im = new Image(); im.onload = () => { fit(im.width / im.height); if (C === CUR) R.draw(C); }; im.onerror = () => { C.ui.url = picCode(C.x.kind, C.x.pk); fit(.75); if (C === CUR) R.draw(C); }; im.src = url; }
  }
  return R;
})();

/* ================= Nonogram (תמונה נסתרת) ================= */
UI.nono = (() => {
  const R = {
    start(C) { C.x.mode = 1; },
    mount(C) { C.ui = { cells: [] }; },
    layout(C, W, H) {
      const P = C.P, lw = Math.max(...P.rows.map(r => r.length), 1) * .62 + .3, th = Math.max(...P.cols.map(c => c.length), 1) * .62 + .3;
      const cs = Math.min(W / (P.W + lw), H / (P.H + th), 56), G = C.ui.g = { cs, ox: lw * cs, oy: th * cs, W: (P.W + lw) * cs, H: (P.H + th) * cs };
      C.el.style.width = px(G.W); C.el.style.height = px(G.H); C.el.innerHTML = '';
      C.ui.clues = mk(C.el, 'pz'); place(C.ui.clues, 0, 0, G.W, G.H);
      C.el.insertAdjacentHTML('beforeend', '<div class="pz" style="left:' + px(G.ox) + ';top:' + px(G.oy) + ';width:' + px(P.W * cs) + ';height:' + px(P.H * cs) + ';background:#fffdf6;border-radius:4px"></div>');
      C.ui.cells = [...Array(P.n).keys()].map(i => { const e = mk(C.el, 'nn-c'); place(e, G.ox + (i % P.W) * cs, G.oy + ((i / P.W) | 0) * cs, cs, cs); return e; });
      let gl = '<svg class="pz" width="' + G.W + '" height="' + G.H + '" style="left:0;top:0">';
      for (let x = 0; x <= P.W; x++) gl += '<line x1="' + (G.ox + x * cs) + '" y1="' + G.oy + '" x2="' + (G.ox + x * cs) + '" y2="' + (G.oy + P.H * cs) + '" stroke="#78909c" stroke-width="' + (x % 5 ? 1 : 2.5) + '"/>';
      for (let y = 0; y <= P.H; y++) gl += '<line x1="' + G.ox + '" y1="' + (G.oy + y * cs) + '" x2="' + (G.ox + P.W * cs) + '" y2="' + (G.oy + y * cs) + '" stroke="#78909c" stroke-width="' + (y % 5 ? 1 : 2.5) + '"/>';
      C.el.insertAdjacentHTML('beforeend', gl + '</svg>');
      if (!C.ui.bound) { C.ui.bound = true; bind(C); }
    },
    draw(C) {
      const P = C.P, G = C.ui.g; if (!G) return; const cs = G.cs, won = ENG.nono.won(C.S, P);
      C.ui.cells.forEach((e, i) => { const v = C.S.f[i]; e.className = 'nn-c' + (v === 1 ? ' on' : v === 2 ? ' x' : '') + (won && P.sol[i] ? ' rev' : '') + (C.x.hint && C.x.hint[0] === i ? ' hint' : ''); e.style.background = won && P.sol[i] ? P.col[i] : ''; e.style.fontSize = px(cs * .6); });
      // clues: a row/column turns grey when it matches
      const row = y => { const a = []; let n = 0; for (let x = 0; x < P.W; x++) { if (C.S.f[y * P.W + x] === 1) n++; else if (n) { a.push(n); n = 0; } } if (n) a.push(n); return a.join() === P.rows[y].join(); };
      const col = x => { const a = []; let n = 0; for (let y = 0; y < P.H; y++) { if (C.S.f[y * P.W + x] === 1) n++; else if (n) { a.push(n); n = 0; } } if (n) a.push(n); return a.join() === P.cols[x].join(); };
      let h = '';
      P.rows.forEach((r, y) => { const L = r.length ? r : [0]; L.forEach((v, k) => { h += '<b class="nn-k' + (row(y) ? ' done' : '') + '" style="left:' + px(G.ox - (L.length - k) * cs * .62 - cs * .12) + ';top:' + px(G.oy + y * cs) + ';width:' + px(cs * .6) + ';height:' + px(cs) + ';font-size:' + px(cs * .48) + '">' + v + '</b>'; }); });
      P.cols.forEach((c, x) => { const L = c.length ? c : [0]; L.forEach((v, k) => { h += '<b class="nn-k' + (col(x) ? ' done' : '') + '" style="left:' + px(G.ox + x * cs) + ';top:' + px(G.oy - (L.length - k) * cs * .62 - cs * .1) + ';width:' + px(cs) + ';height:' + px(cs * .6) + ';font-size:' + px(cs * .48) + '">' + v + '</b>'; }); });
      C.ui.clues.innerHTML = h;
    },
    async anim(C, prev, m) { beep(C.x.mode === 2 ? 'tap' : 'place'); R.draw(C); if (ENG.nono.won(C.S, C.P)) { beep('gem'); await wait(500); } },
    hintShow(C, m) { C.x.hint = m; R.draw(C); if (!m[1]) status(T('nonoWrong'), 1800); },
    hintClear(C) { if (C.x && C.x.hint) { C.x.hint = null; if (C.ui && C.ui.g) R.draw(C); } },
    pills(C) { return '<button class="pill pbtn' + (C.x.mode === 1 ? ' pon' : '') + '" data-pk="m1">⬛ ' + T('nonoPaint') + '</button><button class="pill pbtn' + (C.x.mode === 2 ? ' pon' : '') + '" data-pk="m2">✖ ' + T('nonoMark') + '</button>'; },
    pillTap(C, k) { C.x.mode = k === 'm2' ? 2 : 1; renderInfo(); },
    intro(C) { if (C.i < 2) status(T('nonoGoal'), 3400); }
  };
  function bind(C) {
    let d = null;
    const cellAt = (x, y) => { const G = C.ui.g, P = C.P, c = Math.floor((x - G.ox) / G.cs), r = Math.floor((y - G.oy) / G.cs); return c < 0 || r < 0 || c >= P.W || r >= P.H ? -1 : r * P.W + c; };
    C.el.addEventListener('pointerdown', e => {
      if (C !== CUR || C.busy || C.over) return; const [x, y] = bpt(C, e), i = cellAt(x, y); if (i < 0) return;
      hintClear(); const cur = C.S.f[i], v = C.x.mode === 2 ? (cur === 2 ? 0 : 2) : (cur === 1 ? 0 : 1);
      d = { v, cells: [i], dir: null, i0: i }; C.ui.cells[i].classList.add('pend'); try { C.el.setPointerCapture(e.pointerId); } catch (er) {}
    });
    C.el.addEventListener('pointermove', e => {
      if (!d) return; const [x, y] = bpt(C, e), i = cellAt(x, y); if (i < 0 || d.cells.includes(i)) return;
      const P = C.P, r0 = (d.i0 / P.W) | 0, c0 = d.i0 % P.W, r = (i / P.W) | 0, c = i % P.W;
      if (!d.dir) d.dir = r === r0 ? 'h' : c === c0 ? 'v' : null;
      if ((d.dir === 'h' && r !== r0) || (d.dir === 'v' && c !== c0)) return;     // a stroke stays in its row or column
      // fill the gap if the finger jumped
      const step = d.dir === 'h' ? (c > c0 ? 1 : -1) : (r > r0 ? P.W : -P.W);
      for (let k = d.i0; ; k += step) { if (!d.cells.includes(k)) { d.cells.push(k); C.ui.cells[k].classList.add('pend'); } if (k === i) break; }
    });
    C.el.addEventListener('pointerup', () => {
      if (!d) return; const D = d; d = null; C.ui.cells.forEach(e => e.classList.remove('pend'));
      const cells = D.cells.filter(i => C.S.f[i] !== D.v); if (!cells.length) return;
      doMove(cells.length === 1 ? [cells[0], D.v] : ['s', cells, D.v]);
    });
    C.el.addEventListener('pointercancel', () => { d = null; C.ui.cells.forEach(e => e.classList.remove('pend')); });
  }
  return R;
})();

      + '<path d="' + T4.outline(sh).map(([a, b]) => 'M' + a.join(' ') + 'L' + b.join(' ')).join('') + '" stroke="rgba(255,255,255,.35)" stroke-width="' + (1 / s).toFixed(3) + '" fill="none" transform="translate(' + (-.6 / s).toFixed(3) + ' ' + (-.6 / s).toFixed(3) + ')"/></svg>';

/* ================= Mines (שולה המוקשים) ================= */
UI.mines = (() => {
  const NC = ['', '#1e88e5', '#43a047', '#e53935', '#5e35b1', '#8d6e63', '#00897b', '#263238', '#757575'];

    start(C) { C.x.flag = false; },

    layout(C, W, H) {

      C.ui.cells = [...Array(P.n).keys()].map(i => { const e = mk(C.el, 'mn-c'); place(e, (i % P.W) * cs, ((i / P.W) | 0) * cs, cs, cs); e.dataset.cell = i; e.style.fontSize = px(cs * .55); return e; });

    },
    draw(C) {

        const o = C.S.o[i];
        if (o === 1) { const boom = C.S.boom === i; e.className = 'mn-c o' + (boom ? ' boom' : '') + (i === P.s ? ' st' : ''); e.innerHTML = boom ? '💣' : P.num[i] ? '<b style="color:' + NC[P.num[i]] + '">' + P.num[i] + '</b>' : ''; }
        else { e.className = 'mn-c h' + (o === 2 ? ' f' : '') + (won && P.M[i] ? ' flower' : '') + (C.x.hint && C.x.hint[1] === i ? ' hint' : ''); e.innerHTML = won && P.M[i] ? '🌼' : o === 2 ? '🚩' : ''; }
      });
    },
    async anim(C, prev, m) {
      if (C.S.boom >= 0) { beep('lose'); buzz([60, 40, 60]); R.draw(C); anim(C.el, [{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], 260); await wait(200); return; }
      beep(m[0] === 'f' ? 'tap' : 'place'); R.draw(C); if (ENG.mines.won(C.S, C.P)) beep('done'); await wait(20);
    },
    hintShow(C, m) { C.x.hint = m; R.draw(C); },
    hintClear(C) { if (C.x && C.x.hint) { C.x.hint = null; if (C.ui && C.ui.cells.length) R.draw(C); } },
    pills(C) { const f = C.S.o.filter(v => v === 2).length; return '<span class="pill">💣 <b class="ltr">' + (C.P.mines - f) + '</b></span><button class="pill pbtn' + (C.x.flag ? ' pon' : '') + '" data-pk="flag">🚩 ' + T('minesFlag') + '</button>'; },
    pillTap(C, k) { if (k === 'flag') { C.x.flag = !C.x.flag; beep('tap'); renderInfo(); } },
    intro(C) { if (C.i < 3) status(T('minesGoal'), 4200); }
  };
  function bind(C) {
    let t = null, longDone = false, at = -1;
    C.el.addEventListener('pointerdown', e => {
      if (C !== CUR || C.busy || C.over) return; const c = e.target.closest('[data-cell]'); if (!c) return;
      at = +c.dataset.cell; longDone = false; clearTimeout(t);
      t = setTimeout(() => { if (at < 0 || C.S.o[at] === 1) return; longDone = true; buzz(30); doMove(['f', at]); }, 430);   // long press = flag
    });
    const cancel = () => { clearTimeout(t); at = -1; };
    C.el.addEventListener('pointerup', () => {
      clearTimeout(t); const i = at; at = -1; if (i < 0 || longDone || C !== CUR || C.over) return;

      if (C.x.flag) { doMove(['f', i]); return; }

    C.el.addEventListener('contextmenu', e => e.preventDefault());
  }

})();

/* ---------- weekly missions: three each week (Sunday → Saturday), the same for everyone ---------- */
const weekNo = () => Math.floor((dayNo(today()) + 4) / 7);
const WEEK = (() => { const w = LS.get('week', null); return w && w.w === weekNo() ? w : { w: weekNo(), c: { wins: 0, stars: 0, daily: 0, nohint: 0, three: 0, games: {}, gw: {} }, done: [] }; })();
const saveWeek = () => LS.set('week', WEEK);
const MKINDS = [['wins', [8, 10, 12]], ['stars', [15, 20, 25]], ['game', [4, 5]], ['variety', [3, 4, 5]], ['daily', [2, 3]], ['nohint', [4, 6]], ['three', [5, 7]]];
function weekMissions(w) {
  w = w == null ? weekNo() : w;
  const r = PZ.rng((w * 2654435761) >>> 0), kinds = PZ.shuffle(r, MKINDS.slice()).slice(0, 3);
  return kinds.map(([k, ns]) => ({ k, n: ns[PZ.ri(r, ns.length)], g: GAME_IDS[PZ.ri(r, GAME_IDS.length)] }));
}
function missionProgress(m) {
  const c = WEEK.c;
  return m.k === 'wins' ? c.wins : m.k === 'stars' ? c.stars : m.k === 'game' ? (c.gw[m.g] || 0) : m.k === 'variety' ? Object.keys(c.games).length : m.k === 'daily' ? c.daily : m.k === 'nohint' ? c.nohint : c.three;
}
const missionText = m => T('wk_' + m.k, { n: m.n, g: gname(m.g) });
// after every win: count it, and return the missions finished just now
function weekWin(C, st) {
  if (WEEK.w !== weekNo()) { WEEK.w = weekNo(); WEEK.c = { wins: 0, stars: 0, daily: 0, nohint: 0, three: 0, games: {}, gw: {} }; WEEK.done = []; }
  if (C.mode === 'endless' || !st) return [];
  const c = WEEK.c; c.wins++; c.stars += st; c.games[C.g] = 1; c.gw[C.g] = (c.gw[C.g] || 0) + 1;
  if (C.mode === 'daily') c.daily++; if (!C.hints) c.nohint++; if (st === 3) c.three++;
  const out = [];
  weekMissions().forEach((m, i) => { if (!WEEK.done.includes(i) && missionProgress(m) >= m.n) { WEEK.done.push(i); out.push(m); CNT.missions = (CNT.missions || 0) + 1; } });
  saveWeek(); if (out.length) saveCnt();
  return out;
}
const weekDoneHTML = ms => ms.length ? '<div class="stk-new"><b>🎯 ' + T('wkDone') + '</b>' + ms.map(m => '<p style="margin:4px 0">✅ ' + esc(missionText(m)) + '</p>').join('') + '</div>' : '';
function renderWeek() {
  const box = $('#weekBox'); if (!box) return;
  if (WEEK.w !== weekNo()) { WEEK.w = weekNo(); WEEK.c = { wins: 0, stars: 0, daily: 0, nohint: 0, three: 0, games: {}, gw: {} }; WEEK.done = []; saveWeek(); }
  const ms = weekMissions(), left = 7 - ((dayNo(today()) + 4) % 7);
  box.innerHTML = '<div class="week"><div class="wk-h"><b>🎯 ' + T('wkTitle') + '</b><span>' + T('wkLeft', { n: left }) + '</span></div>'
    + ms.map((m, i) => { const p = Math.min(m.n, missionProgress(m)), ok = WEEK.done.includes(i); return '<div class="wk-m' + (ok ? ' ok' : '') + '"><span class="wk-i">' + (ok ? '✅' : m.k === 'game' ? GICON[m.g] : { wins: '🏁', stars: '⭐', variety: '🎲', daily: '☀️', nohint: '🧠', three: '🌟' }[m.k]) + '</span><span class="wk-t">' + esc(missionText(m)) + '<i class="wk-bar"><i style="width:' + (100 * p / m.n).toFixed(0) + '%"></i></i></span><b class="ltr">' + p + '/' + m.n + '</b></div>'; }).join('')
    + '<div class="wk-f">' + T('wkReward') + '</div></div>';
}

/* ---------- the album: a card for every few stars, gold cards for missions ---------- */
const ALBUM = [
  ['animals', '🦁 🐼 🐸 🦊 🐵 🐨 🐯 🐰 🐶 🐱 🐘 🦒'],
  ['sea', '🐳 🐬 🐙 🦀 🐠 🐢 🦈 🐡 🦭 🐚 🪼 🦞'],

  ['food', '🍕 🍦 🍩 🍉 🍓 🍌 🧁 🍪 🥞 🍿 🍔 🌮'],
  ['wheels', '🚒 🚑 🚓 🚜 🚂 🚁 ✈️ 🚲 🛵 🚢 🏎️ 🚌'],
  ['magic', '🦄 🐉 🧚 🧙 🏰 👑 🪄 💎 🌈 🎠 🧞 🔮'],
  ['gold', '🏆 🥇 🎖️ 🏅 🎗️ 🌟 🎁 🪙 🎉 🧸 🎈 🍀']

const albumCards = page => ALBUM[page][1].split(' ');
const CARD_N = 72;                                                    // star cards (6 pages × 12); then 12 gold
const cardAt = k => 3 + k * 3 + Math.floor(k * k / 12);               // stars needed for star card k
const allStars = () => GAME_IDS.reduce((a, g) => a + totalStars(g), 0);
function cardsOwned() {
  const s = allStars(), out = [];
  for (let k = 0; k < CARD_N; k++) if (s >= cardAt(k)) out.push(k);
  const gold = Math.min(12, CNT.missions || 0); for (let k = 0; k < gold; k++) out.push(CARD_N + k);
  return out;
}
const cardEmoji = k => albumCards(Math.floor(k / 12))[k % 12];
const newCardsHTML = ks => ks.length ? '<div class="stk-new"><b>🃏 ' + (ks.length > 1 ? T('newCards') : T('newCard')) + '</b><div class="cards-new">' + ks.map(k => '<span class="acard got' + (k >= CARD_N ? ' gold' : '') + '"><i>' + cardEmoji(k) + '</i></span>').join('') + '</div></div>' : '';
let albumPage = 0;
function renderAlbum() {
  const own = new Set(cardsOwned()), s = allStars(), next = [...Array(CARD_N).keys()].find(k => !own.has(k));
  let h = '<div class="card al-top"><b>🃏 <span class="ltr">' + own.size + '/' + (CARD_N + 12) + '</span></b><span>' + (next != null ? T('alNext', { n: cardAt(next) - s }) : T('alAll')) + '</span></div>';
  h += '<div class="al-tabs">' + ALBUM.map(([id], p) => { const got = [...Array(12).keys()].filter(j => own.has(p * 12 + j)).length; return '<button data-ap="' + p + '"' + (p === albumPage ? ' class="on"' : '') + '><i>' + albumCards(p)[0] + '</i>' + T('al_' + id) + '<small class="ltr">' + got + '/12</small></button>'; }).join('') + '</div>';
  h += '<div class="al-grid">' + [...Array(12).keys()].map(j => { const k = albumPage * 12 + j, got = own.has(k); return '<button class="acard' + (got ? ' got' : '') + (k >= CARD_N ? ' gold' : '') + '" data-ac="' + k + '"><i>' + (got ? cardEmoji(k) : '❔') + '</i><small class="ltr">' + (got ? '#' + (k + 1) : k >= CARD_N ? '🎯' + (k - CARD_N + 1) : '⭐' + cardAt(k)) + '</small></button>'; }).join('') + '</div>';
  if (albumPage === 6) h += '<p class="muted" style="text-align:center;font-size:14px">' + T('alGold') + '</p>';
  const B = $('#albumBody'); B.innerHTML = h;
  B.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => { albumPage = +b.dataset.ap; renderAlbum(); });
  B.querySelectorAll('[data-ac]').forEach(b => b.onclick = () => {
    const k = +b.dataset.ac;
    if (!own.has(k)) { beep('err'); toast(k >= CARD_N ? T('alGoldHow') : T('alNeed', { n: cardAt(k) }), 2200); return; }
    beep('star', 2); const o = overlay('<div class="al-big' + (k >= CARD_N ? ' gold' : '') + '"><i>' + cardEmoji(k) + '</i><b class="ltr">#' + (k + 1) + '</b></div>'); o.onclick = () => closeOv(o);
  });
}

let TILE_OK = false;
const TILE_FILES = ['park', 'ring', 'water', 'nuts', 'unblock', 'blocks', 'flow', 'slide', 'lights', 'pipes', 'soko'];
function tileProbe() { if (!ART_ON) return; const i = new Image(); i.onload = () => { TILE_OK = true; if (SCREEN === 'home') renderHome(); }; i.src = 'tile-park.webp'; }
function goHome() { show('home'); renderHome(); }
function renderHome() {
  $('#verLbl').textContent = 'v' + APP_VERSION;
  $('#meAv').innerHTML = avHTML(myAv()); $('#meName').textContent = ST.name || T('you');
  $('#gameGrid').innerHTML = GAME_IDS.map((g, k) => {
    const n = NLV(g), d = doneCount(g), st = totalStars(g);
    return '<button class="gtile gt-' + g + (k === GAME_IDS.length - 1 && GAME_IDS.length % 2 ? ' wide' : '') + '" data-tile="' + g + '"><span class="art">' + (TILE_OK && TILE_FILES.includes(g) ? '<img class="tl" src="tile-' + g + '.webp" alt="" draggable="false" data-tg="' + g + '" onerror="this.outerHTML=TILE_ART[this.dataset.tg]">' : TILE_ART[g]) + '</span><span class="txt"><b>' + esc(gname(g)) + '</b> <span class="pr ltr">' + d + '/' + n + ' · ⭐' + st + '</span></span></button>';
  }).join('');
  // the last tile spans the row; without the txt wrapper the others stay as before
  $('#gameGrid').querySelectorAll('.gtile:not(.wide) .txt').forEach(t => t.replaceWith(...t.childNodes));
  $('#gameGrid').querySelectorAll('[data-tile]').forEach(b => b.onclick = () => openMap(b.dataset.tile));
  // daily
  const dd = dailyOf(today()), done = DAILY.done[today()], streak = DAILY.last && dayNo(today()) - dayNo(DAILY.last) <= 1 ? DAILY.streak : 0;
  const db = $('#dailyBtn'); db.classList.toggle('done', !!done);
  db.innerHTML = '<span class="ic">' + (done ? '✅' : GICON[dd.g]) + '</span><span><b>' + T('daily') + '</b><span>' + (done ? T('dailyDone') + ' ' + '⭐'.repeat(done) : esc(gname(dd.g)) + ' · ' + T('dailyD')) + '</span></span><span class="fire">🔥' + streak + '<small>' + T('streak') + '</small></span>';
  db.onclick = () => openLevel(dd.g, dd.i, 'daily');
  // resume
  const s = LS.get('cur', null), box = $('#resumeBox');
  if (s && ENG[s.g] && !(s.mode === 'daily' && s.date !== today())) {
    box.innerHTML = '<button class="mode" id="resBtn"><span class="ic">' + GICON[s.g] + '</span><span><b>' + T('resume') + '</b><span>' + esc(gname(s.g)) + ' · ' + (s.mode === 'endless' ? T('endless') : s.mode === 'daily' ? T('daily') : T('levelN', { n: s.i + 1 })) + '</span></span></button>';
    $('#resBtn').onclick = () => resumeSaved();
  } else box.innerHTML = '';
  renderWeek();
}

/* ---------- the level map: a winding trail, chapters of 25 ---------- */
const CHAP = 25;
const GCOL = { park: '#5b7d9e', ring: '#ff7a59', water: '#3db4f2', nuts: '#8a96a3', unblock: '#f0a92c', blocks: '#9b5de5', flow: '#16b6a8', slide: '#e8508a', lights: '#f2c230', pipes: '#4f9e3f', soko: '#b8783c', hashi: '#1e88e5', sudoku: '#5e35b1', hanoi: '#d84315', rotate: '#00897b', nono: '#c2185b', tangram: '#3949ab', line: '#ef6c00', maze: '#2e7d32', kakuro: '#6d4c41', mmind: '#ad1457', mines: '#546e7a' };
function openMap(g) {
  const n = NLV(g), cur = unlockedUpTo(g), p = prog(g);
  $('#mapTitle').textContent = GICON[g] + ' ' + gname(g);
  const three = Object.values(p.s).filter(x => x === 3).length;

    + '<span style="flex:1"></span><button class="btn" id="mRules">📖 ' + T('howTo') + '</button>' + (g === 'blocks' ? '<button class="btn main" id="mEndless">∞ ' + T('endless') + (CNT.endlessBest ? ' · 🏆' + CNT.endlessBest : '') + '</button>' : '');
  if (g === 'slide') {
    $('#mapHead').insertAdjacentHTML('beforeend', '<div class="picks" id="mPicks">' + PIC_KINDS.map(k => '<button data-pkind="' + k + '"' + ((ST.slidePic || 'kids') === k ? ' class="on"' : '') + '><i>' + PIC_ICON[k] + '</i>' + T('pk_' + k) + '</button>').join('') + '</div>');
    $('#mPicks').onclick = e => { const b = e.target.closest('[data-pkind]'); if (!b) return; const k = b.dataset.pkind; if (k === 'mine' && !myPhotos().length) { photosBox(() => openMap('slide')); return; } ST.slidePic = k; saveST(); $$('#mPicks button').forEach(x => x.classList.toggle('on', x === b)); if (k === 'mine') photosBox(); };
  }
  if (g === 'rotate') {
    $('#mapHead').insertAdjacentHTML('beforeend', '<div class="picks" id="mPicks">' + PIC_KINDS.filter(k => k !== 'num').map(k => '<button data-rkind="' + k + '"' + ((ST.rotPic || 'kids') === k ? ' class="on"' : '') + '><i>' + PIC_ICON[k] + '</i>' + T('pk_' + k) + '</button>').join('') + '</div>');
    $('#mPicks').onclick = e => { const b = e.target.closest('[data-rkind]'); if (!b) return; const k = b.dataset.rkind; if (k === 'mine' && !myPhotos().length) { photosBox(() => openMap('rotate')); return; } ST.rotPic = k; saveST(); $$('#mPicks button').forEach(x => x.classList.toggle('on', x === b)); };
  }
  if (g === 'sudoku') {
    $('#mapHead').insertAdjacentHTML('beforeend', '<div class="picks" id="mPicks">' + [['num', '🔢'], ['pics', '🍎']].map(([k, ic]) => '<button data-skind="' + k + '"' + ((ST.sudoSym || 'num') === k ? ' class="on"' : '') + '><i>' + ic + '</i>' + T('sym_' + k) + '</button>').join('') + '</div>');
    $('#mPicks').onclick = e => { const b = e.target.closest('[data-skind]'); if (!b) return; ST.sudoSym = b.dataset.skind; saveST(); $$('#mPicks button').forEach(x => x.classList.toggle('on', x === b)); };
  }
  $('#mRules').onclick = () => openRules(g, true);
  if (g === 'blocks') $('#mEndless').onclick = () => openLevel('blocks', 0, 'endless');
  const tr = $('#trail'), W = Math.min(520, document.documentElement.clientWidth), STEP = 96, TOP = 50;
  const gc = GCOL[g];
  let y = TOP, html = '', pts = [];
  for (let i = 0; i < n; i++) {
    if (i % CHAP === 0) { html += '<div class="chap" style="top:' + (y - 40) + 'px"><span>' + T('ch_' + Math.min(7, i / CHAP)) + ' · <span class="ltr">' + (i + 1) + '–' + Math.min(n, i + CHAP) + '</span></span></div>'; y += 92; }
    const x = W / 2 + Math.sin(i * .9) * (W * .3);
    pts.push([x, y]);
    const s = p.s[i] || 0, open = isOpen(g, i), isCur = i === cur;
    html += '<button class="lvn' + (open ? '' : ' lock') + (isCur ? ' cur' : '') + '" data-lv="' + i + '" style="left:' + x.toFixed(0) + 'px;top:' + y + 'px;--gc:' + gc + '">' + (open ? i + 1 : '🔒')
      + (open && s ? '<span class="st">' + [0, 1, 2].map(k => '<i' + (k < s ? '' : ' class="o"') + '>★</i>').join('') + '</span>' : '')
      + (isCur ? '<span class="who">' + avHTML(myAv()) + '</span>' : '') + '</button>';
    y += STEP;
    if ((i + 1) % CHAP === 0) y += 40;
  }
  const H = y + 20;
  const path = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(0) + ' ' + q[1]).join(' ');
  tr.style.height = H + 'px'; tr.style.width = W + 'px';
  tr.innerHTML = '<svg class="path" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"><path d="' + path + '" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16"/></svg>'
    + '<div style="position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;direction:ltr">' + html + '</div>';
  tr.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => {
    const i = +b.dataset.lv;
    if (!isOpen(g, i)) { beep('err'); toast(T('locked'), 1600); return; }
    openLevel(g, i, 'level');
  });
  show('map');
  // scroll the current level into view
  requestAnimationFrame(() => { const el = tr.querySelector('.lvn.cur'); if (el) window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - innerHeight / 2)); });
}

/* ---------- stickers ---------- */
const STICKERS = [
  ['first', '🎉'], ['three', '⭐'], ['park10', '🚗'], ['ring10', '🍩'], ['water10', '🧪'], ['nuts10', '🔩'], ['unblock10', '🚙'], ['blocks10', '🧱'], ['flow10', '🌈'], ['slide10', '🧩'], ['lights10', '💡'], ['pipes10', '🚰'], ['soko10', '📦'], ['hashi10', '🌉'], ['sudoku10', '🔢'], ['hanoi10', '🗼'], ['rotate10', '🔄'], ['nono10', '🎨'], ['tangram10', '🔷'], ['line10', '✏️'], ['maze10', '🌀'], ['kakuro10', '➕'], ['mmind10', '🔐'], ['mines10', '💣'], ['myPhoto', '📷'],
  ['allGames', '🎨'], ['daily1', '☀️'], ['daily3', '🔥'], ['daily7', '🏅'], ['nohint10', '🧠'], ['perfect20', '🌟'], ['stars100', '💯'], ['stars300', '🏆'],
  ['chapter', '👑'], ['week1', '🎯'], ['album24', '🃏'], ['cars50', '🅿️'], ['endless500', '💥'], ['endless2000', '💎'], ['hard', '🦉']
];
let STK = LS.get('stickers', {});
function earn(id, out) { if (STK[id]) return; STK[id] = Date.now(); out.push(id); }
function checkStickers(C, st) {
  const got = [];
  const all = GAME_IDS.reduce((a, g) => a + doneCount(g), 0), stars = GAME_IDS.reduce((a, g) => a + totalStars(g), 0);
  const threes = GAME_IDS.reduce((a, g) => a + Object.values(prog(g).s).filter(x => x === 3).length, 0);
  if (all >= 1) earn('first', got);
  if (st === 3) earn('three', got);
  GAME_IDS.forEach(g => { if (doneCount(g) >= 10) earn(g + '10', got); });
  if (GAME_IDS.every(g => CNT.played[g])) earn('allGames', got);
  if (C.mode === 'daily' && st) { earn('daily1', got); if (DAILY.streak >= 3) earn('daily3', got); if (DAILY.streak >= 7) earn('daily7', got); }
  if (CNT.nohint >= 10) earn('nohint10', got);
  if (threes >= 20) earn('perfect20', got);
  if (stars >= 100) earn('stars100', got); if (stars >= 300) earn('stars300', got);
  if (C.mode === 'level') { const ch = Math.floor(C.i / CHAP) * CHAP, p = prog(C.g).s; let full = true; for (let i = ch; i < Math.min(NLV(C.g), ch + CHAP); i++) if (p[i] !== 3) { full = false; break; } if (full) earn('chapter', got); }
  if (CNT.cars >= 50) earn('cars50', got);
  if (CNT.missions >= 1) earn('week1', got);
  if (cardsOwned().length >= 24) earn('album24', got);
  if (C.g === 'slide' && st && C.x && C.x.kind === 'mine') earn('myPhoto', got);
  if (C.mode === 'endless') { if (C.S.score >= 500) earn('endless500', got); if (C.S.score >= 2000) earn('endless2000', got); }
  if (C.mode === 'level' && st && C.i >= NLV(C.g) * .75) earn('hard', got);
  if (got.length) LS.set('stickers', STK);
  return got;
}

    + STICKERS.map(([id, ic]) => '<button class="stk-i' + (STK[id] ? ' got' : '') + '" data-stk="' + id + '"><i>' + ic + '</i><span>' + esc(T('st_' + id)) + '</span></button>').join('') + '</div></div>';
}
function bindAlbum(root) { root.querySelectorAll('[data-stk]').forEach(b => b.onclick = () => { const id = b.dataset.stk; toast((STK[id] ? '🏅 ' : '🔒 ') + esc(T('std_' + id)), 3000); }); }
const newStickersHTML = ids => ids.length ? '<div class="stk-new"><b>🏅 ' + (ids.length > 1 ? T('newStickers') : T('newSticker')) + '</b><div class="stk">' + ids.map(id => { const s = STICKERS.find(x => x[0] === id); return '<span class="stk-i got"><i>' + s[1] + '</i><span>' + esc(T('st_' + id)) + '</span></span>'; }).join('') + '</div></div>' : '';

function exportBackup() {
  const data = { app: 'puzzlenest', v: APP_VERSION, by: ST.name, date: new Date().toISOString(), settings: ST, prog: PROG, daily: DAILY, cnt: CNT, stickers: STK, week: WEEK, cur: LS.get('cur', null) };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }), name = 'puzzlenest-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = typeof File !== 'undefined' ? new File([blob], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'PuzzleNest', text: T('backupBy', { n: ST.name || '' }) }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(T('exported'));
}
function importBackup(f) {
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast(T('badFile')); return; }
    if (!d || d.app !== 'puzzlenest') { toast(T('badFile')); return; }
    confirmBox(T('importQ', { n: d.by || '?', d: (d.date || '').slice(0, 10) }), T('importB'), () => {
      LS.set('settings', d.settings || {}); LS.set('prog', d.prog || {}); LS.set('daily', d.daily || {}); LS.set('cnt', d.cnt || {}); LS.set('stickers', d.stickers || {}); if (d.week) LS.set('week', d.week);
      if (d.cur) LS.set('cur', d.cur); else LS.del('cur');
      location.reload();
    });
  };
  r.readAsText(f);
}

/* ---------- stats ---------- */
function renderStats() {
  let h = '<div class="card"><h3>🔥 ' + T('daily') + '</h3><div class="stat"><div><b class="ltr">' + (DAILY.last && dayNo(today()) - dayNo(DAILY.last) <= 1 ? DAILY.streak : 0) + '</b><span>' + T('s_streak') + '</span></div><div><b class="ltr">' + DAILY.best + '</b><span>' + T('s_bestStreak') + '</span></div><div><b class="ltr">' + Object.keys(DAILY.done).length + '</b><span>' + T('s_dailies') + '</span></div></div></div>';
  for (const g of GAME_IDS) {
    const p = prog(g), d = doneCount(g); if (!d && !(g === 'blocks' && CNT.endlessBest)) continue;
    const cells = [['s_done', d + '/' + NLV(g)], ['s_stars', totalStars(g)], ['s_three', Object.values(p.s).filter(x => x === 3).length]];
    if (g === 'blocks') cells.push(['s_record', CNT.endlessBest || 0]);

    h += '<div class="card"><h3>' + GICON[g] + ' ' + esc(gname(g)) + '</h3><div class="stat">' + cells.map(c => '<div><b class="ltr">' + c[1] + '</b><span>' + T(c[0]) + '</span></div>').join('') + '</div></div>';
  }

}

function openGuide() {
  const steps = [['🚗🧪🔩🧱', 'g1'], ['🗺️⭐', 'g2'], ['↩️🔄💡', 'g3'], ['☀️🔥', 'g4'], ['🦁🏅', 'g5']];
  let i = 0;
  const o = overlay('<div class="guide" id="gBox"></div>');
  const draw = () => {
    o.querySelector('#gBox').innerHTML = '<div class="gbig">' + steps[i][0] + '</div><h2 style="text-align:center;margin-top:8px">' + T(steps[i][1] + 't') + '</h2><p style="font-size:17px;text-align:center">' + T(steps[i][1] + 'd') + '</p>'
      + '<div class="dots">' + steps.map((s, k) => '<i' + (k === i ? ' class="on"' : '') + '></i>').join('') + '</div>'
      + '<div class="row"><button class="btn" data-gd="skip">' + T('skip') + '</button><button class="btn main" data-gd="next">' + (i < steps.length - 1 ? T('next') : T('letsPlay')) + '</button></div>';
  };
  o.onclick = e => { const b = e.target.closest('[data-gd]'); if (!b) return; if (b.dataset.gd === 'next' && i < steps.length - 1) { i++; draw(); } else { ST.guided = true; saveST(); closeOv(o); } };
