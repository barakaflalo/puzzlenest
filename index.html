<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PuzzleNest · פאזלים לכל המשפחה</title>
<meta name="description" content="PuzzleNest — שבעה משחקי פאזל לכל המשפחה: חניון פקוק, מיון טבעות, מיון מים, ברגים ואומים, שחרר את המכונית, בלוקים וזרימה. מאות שלבים, עובד אופליין.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="PuzzleNest · פאזלים לכל המשפחה">
<meta property="og:description" content="שבעה משחקי פאזל, מאות שלבים מקל לקשה, רמז מהפותר ושלב יומי — עובד גם בלי אינטרנט.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ---------------- tokens: app theme (data-theme × data-mode) — same as FamilyNest ---------------- */
:root{
  --bg:#070707; --panel:#121212; --panel2:#1a1a1a; --line:#2c2a24; --ink:#f3efe4; --muted:#a39d8c;
  --acc:#d4a940; --acc2:#f0cd6e; --accInk:#140f02; --ok:#46b46e; --bad:#e0584f; --hint:#59c3ff;
  /* puzzle boards */
  --bd:#fff8ec; --bd2:#f3e6cc; --bdLine:#e0c9a3; --bdInk:#3b2a14; --road:#4a4f57; --road2:#5b616b;
  --r:14px; --disp:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[data-theme="silver"]{--acc:#c9ced6;--acc2:#eef1f5;--accInk:#0d0f12;--line:#2a2d33}
[data-theme="emerald"]{--acc:#3fbf7f;--acc2:#7fe0ae;--accInk:#03140b;--line:#1f3329}
[data-theme="ruby"]{--acc:#e0566a;--acc2:#f598a6;--accInk:#1a0408;--line:#3a2328}
[data-theme="ocean"]{--acc:#4aa8e8;--acc2:#97d0f6;--accInk:#03111c;--line:#1f2d3a}
[data-mode="day"]{--bg:#f4f2ec;--panel:#ffffff;--panel2:#f0ede5;--line:#d9d3c4;--ink:#17150f;--muted:#6b6455}
[data-mode="day"][data-theme="gold"]{--acc:#a8801c;--acc2:#c99b2c;--accInk:#fff}
[data-mode="day"][data-theme="silver"]{--acc:#5c6573;--acc2:#7d8796;--accInk:#fff}
[data-mode="day"][data-theme="emerald"]{--acc:#1f8a55;--acc2:#2ea96b;--accInk:#fff}
[data-mode="day"][data-theme="ruby"]{--acc:#b8344a;--acc2:#d14d62;--accInk:#fff}
[data-mode="day"][data-theme="ocean"]{--acc:#1f6fa8;--acc2:#2f8acb;--accInk:#fff}

body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;line-height:1.15}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------------- screens ---------------- */
.scr{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
.scr.on{display:flex;animation:scrIn .18s ease-out}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.bar h2{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:20px;font-weight:700;flex:none}
.wrap{padding:16px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:19px;margin-bottom:8px}
.btn{border:1.5px solid var(--acc);background:transparent;color:var(--acc);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.main{background:var(--acc);color:var(--accInk);font-size:18px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.huge{min-height:62px;font-size:22px;font-family:var(--disp);font-weight:400;border-radius:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg>button{flex:1;border:0;background:transparent;padding:10px 6px;min-height:46px;font-weight:500;color:var(--muted)}
.seg>button.on{background:var(--acc);color:var(--accInk);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc);flex:none}
.sw small{display:block;font-size:13px}
.toast{position:fixed;inset-inline:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--panel);border:1px solid var(--acc);color:var(--ink);padding:12px 16px;border-radius:12px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.badge{text-align:center;font-size:12px;color:var(--muted);padding:18px 0 8px}
.badge b{color:var(--acc);font-weight:700}

/* ---------------- home ---------------- */
#home .hero{padding:58px 18px 4px;text-align:center;position:relative;overflow:hidden}
.floaty{display:flex;justify-content:center;gap:14px;font-size:36px;height:56px;margin-top:6px}
.floaty>span{display:inline-block;animation:bob 3s ease-in-out infinite}
.floaty>span:nth-child(2){animation-delay:.4s}.floaty>span:nth-child(3){animation-delay:.8s}.floaty>span:nth-child(4){animation-delay:1.2s}.floaty>span:nth-child(5){animation-delay:1.6s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.wordmark{font-family:var(--disp);font-size:54px;line-height:.95;margin-top:6px;color:var(--ink);letter-spacing:.5px;direction:ltr}
.wordmark i{font-style:normal;color:var(--acc)}
.sub{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:21px;color:var(--accInk);background:var(--acc);padding:2px 14px 4px;border-radius:10px;transform:rotate(-2.5deg)}
.quickset{position:absolute;top:10px;inset-inline-end:12px;display:flex;gap:6px;z-index:2}
.quickset button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px}
.me{position:absolute;top:10px;inset-inline-start:12px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:24px;padding:3px 12px 3px 4px;font-size:14px;font-weight:700;max-width:46%}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:22px;flex:none}
.me .av img.ai{width:120%;height:120%}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daily{display:flex;align-items:center;gap:14px;text-align:start;border:0;border-radius:20px;padding:12px 16px;min-height:86px;color:#fff;background:linear-gradient(135deg,#ff9f1c,#ff4f6d);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.25)}
.daily .ic{font-size:40px;width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:rgba(255,255,255,.22);flex:none}
.daily b{display:block;font:400 21px/1.15 var(--disp);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.daily span{font-size:14px;opacity:.95}
.daily .fire{margin-inline-start:auto;font:400 26px/1 var(--disp);text-align:center;flex:none}
.daily .fire small{display:block;font:500 11px var(--body)}
.daily.done{background:linear-gradient(135deg,#2bb673,#14866d)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{position:relative;border:0;border-radius:20px;padding:10px 10px 10px;min-height:156px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;color:#fff;overflow:hidden;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),0 4px 14px rgba(0,0,0,.25);text-align:center}
.gtile:active{transform:scale(.97)}
.gtile .art{width:100%;flex:1;display:grid;place-items:center;min-height:84px}
.gtile .art svg{width:88%;max-width:150px;height:auto;max-height:92px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.gtile .art img.tl{width:94%;max-width:170px;height:auto;max-height:104px;object-fit:contain;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
.gtile b{font-family:var(--disp);font-weight:400;font-size:19px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.gtile .pr{font-size:12px;font-weight:700;background:rgba(0,0,0,.25);border-radius:20px;padding:1px 10px}
.gtile.wide{grid-column:1 / -1;min-height:120px;flex-direction:row;justify-content:center;gap:12px}
.gtile.wide .art{flex:0 0 46%;min-height:96px}
.gtile.wide .txt{display:flex;flex-direction:column;align-items:center;gap:4px}
.gt-park{background:linear-gradient(160deg,#5b6b7d,#2f3b4a)}
.gt-ring{background:linear-gradient(160deg,#ff7a59,#d8432c)}
.gt-water{background:linear-gradient(160deg,#3db4f2,#1b6fc2)}
.gt-nuts{background:linear-gradient(160deg,#9aa7b5,#5d6b79)}
.gt-unblock{background:linear-gradient(160deg,#f6b73c,#d1830f)}
.gt-blocks{background:linear-gradient(160deg,#9b5de5,#6a33b8)}
.gt-flow{background:linear-gradient(160deg,#16b6a8,#0b7d73)}
.gt-slide{background:linear-gradient(160deg,#ff6fa8,#c2185b)}
.gt-lights{background:linear-gradient(160deg,#3d4a6b,#161b2e)}
.gt-pipes{background:linear-gradient(160deg,#7cc45f,#2f7d32)}
.gt-soko{background:linear-gradient(160deg,#c8894a,#7a4a1c)}
.gt-hashi{background:linear-gradient(160deg,#4fa8f0,#1660b0)}
.gt-sudoku{background:linear-gradient(160deg,#8c6be0,#4a2a9a)}
.gt-hanoi{background:linear-gradient(160deg,#ff8a50,#bf360c)}
.gt-rotate{background:linear-gradient(160deg,#26b5a5,#00695c)}
.gt-nono{background:linear-gradient(160deg,#f06292,#ad1457)}
.gt-tangram{background:linear-gradient(160deg,#5c6bc0,#283593)}
.gt-line{background:linear-gradient(160deg,#ffa040,#d84315)}
.gt-maze{background:linear-gradient(160deg,#66bb6a,#1b5e20)}
.gt-kakuro{background:linear-gradient(160deg,#a1887f,#4e342e)}
.gt-mmind{background:linear-gradient(160deg,#ec407a,#6a1b4d)}
.gt-mines{background:linear-gradient(160deg,#78909c,#37474f)}
/* 1.4: tangram */
.tg-p{position:absolute;pointer-events:none;z-index:2;transition:left .12s,top .12s}
.tg-p polygon{pointer-events:visiblePainted;cursor:grab}
.tg-p.on{z-index:3}
.tg-p.drag{z-index:9;transition:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.tg-p.hint{filter:drop-shadow(0 0 6px var(--hint)) drop-shadow(0 0 3px var(--hint));animation:bob 1s ease-in-out infinite}
.tg-p.done{animation:pop .5s}
.tg-tray{position:absolute;border-radius:16px;background:rgba(255,255,255,.05);border:1px dashed var(--line);pointer-events:none}
.tg-ghost{position:absolute;pointer-events:none;opacity:0;z-index:1}
.tg-ghost.on{opacity:1;animation:bob 1s ease-in-out infinite}
.tg-ghost polygon{stroke:var(--hint);stroke-width:.06;stroke-dasharray:.15 .1}
/* one line · maze */
.ln-pulse{animation:lnp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes lnp{50%{transform:scale(1.25);opacity:.4}}
.mz-me{position:absolute;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.35);transition:left .09s linear,top .09s linear;pointer-events:none;z-index:3;overflow:hidden}
.mz-me img.ai{width:118%;height:118%}
.mz-home{position:absolute;display:grid;place-items:center;pointer-events:none;line-height:1}
/* kakuro */
.sd-c.kk{color:#1565c0}
/* secret code */
.mm{display:flex;flex-direction:column;height:100%;gap:8px}
.mm-sec{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;border-radius:14px;background:#2b1f2b;font-size:20px}
.mm-rows{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:4px 2px;min-height:60px}
.mm-row{display:flex;align-items:center;gap:6px;justify-content:center;padding:3px 6px;border-radius:12px;background:rgba(255,255,255,.05)}
.mm-row>b{width:20px;color:var(--muted);font-size:13px}
.mm-empty{text-align:center;margin:auto}
.mm-p{display:inline-grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000));box-shadow:0 2px 3px rgba(0,0,0,.35);font-style:normal;flex:none;position:relative}
.mm-p .sym{font-size:60%}
.mm-p.e{background:rgba(255,255,255,.08);box-shadow:inset 0 2px 4px rgba(0,0,0,.4);border:2px dashed rgba(255,255,255,.25)}
.mm-p.q{background:#4a3a4a;color:#ffd54f;font-weight:800;font-size:20px}
.mm-fb{display:grid;gap:3px;margin-inline-start:6px;direction:ltr}
.mm-fb i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14)}
.mm-fb i.b{background:#111;box-shadow:0 0 0 1.5px #fff}
.mm-fb i.w{background:#fff}
.mm-cur{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.mm-slot{background:none;border:0;padding:0}
.mm-go{padding:10px 14px;font-size:17px}
.mm-go.off{opacity:.45}
.mm-go.hint{box-shadow:0 0 0 3px var(--hint)}
.mm-pal{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding-bottom:4px}
.mm-pc{background:none;border:0;padding:0}
.mm-pc.used{opacity:.25}
/* mines */
.mn-c{position:absolute;display:grid;place-items:center;font-weight:800;line-height:1;user-select:none;-webkit-touch-callout:none}
.mn-c.h{background:linear-gradient(160deg,#b0bec5,#90a4ae);border:1px solid #78909c;border-radius:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35);cursor:pointer}
.mn-c.o{background:#eceff1;border:1px solid #cfd8dc}
.mn-c.o.st{background:#e8f5e9}
.mn-c.boom{background:#ef9a9a}
.mn-c.flower{background:#fff8e1}
.mn-c.hint{box-shadow:0 0 0 3px var(--hint) inset;animation:bob 1s ease-in-out infinite}
/* weekly missions */
.week{border-radius:20px;padding:12px 14px;background:var(--panel);border:1px solid var(--line)}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.wk-h b{font:400 19px var(--disp)}
.wk-h span{font-size:13px;color:var(--muted)}
.wk-m{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.wk-m>b{font-size:14px;color:var(--muted)}
.wk-m.ok{opacity:.7}
.wk-i{font-size:24px;width:32px;text-align:center;flex:none}
.wk-t{flex:1;font-size:14px;display:flex;flex-direction:column;gap:4px}
.wk-bar{display:block;height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.wk-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),#ffd54f)}
.wk-f{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
/* album */
.al-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.al-top b{font:400 22px var(--disp)}
.al-top span{font-size:14px;color:var(--muted)}
.al-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.al-tabs button{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 10px;font-size:13px;color:var(--ink)}
.al-tabs button i{font-style:normal;font-size:22px}
.al-tabs button small{color:var(--muted);font-size:11px}
.al-tabs button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,var(--panel))}
.al-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acard{aspect-ratio:3/4;border-radius:16px;border:2px dashed var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}
.acard i{font-style:normal;font-size:38px;opacity:.5;filter:grayscale(1)}
.acard small{font-size:12px}
.acard.got{border:2px solid rgba(255,255,255,.5);background:linear-gradient(160deg,#4fc3f7,#7e57c2);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.acard.got i{opacity:1;filter:none;font-size:46px}
.acard.gold.got{background:linear-gradient(160deg,#ffe082,#ff8f00)}
.cards-new{display:flex;gap:8px;justify-content:center;margin-top:6px}
.cards-new .acard{width:64px;animation:pop .6s}
.cards-new .acard i{font-size:34px}
.al-big{display:grid;place-items:center;gap:8px;padding:30px;border-radius:24px;background:linear-gradient(160deg,#4fc3f7,#7e57c2);animation:pop .5s}
.al-big.gold{background:linear-gradient(160deg,#ffe082,#ff8f00)}
.al-big i{font-style:normal;font-size:120px;line-height:1}
.al-big b{color:#fff;font-size:20px}
/* players */
.plist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.pl{display:flex;gap:6px;align-items:stretch}
.pl-go{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:6px 10px;color:var(--ink);text-align:start}
.pl.on .pl-go{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--panel2))}
.pl-go .av{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}
.pl-go .av img.ai{width:120%;height:120%}
.pl-go b{flex:1;font-size:16px}
.pl-go small{color:var(--acc);font-size:12px}
.pl-del{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:0 12px;font-size:18px}
.picks{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.picks>button{flex:1;min-width:60px;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.picks>button i{font-style:normal;font-size:22px}
.picks>button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--panel))}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.phgrid>div{position:relative;aspect-ratio:3/4;border-radius:10px;background-size:cover;background-position:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.phgrid>div button{position:absolute;top:4px;inset-inline-end:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;min-height:64px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.tools button i{font-style:normal;font-size:22px}
.mode{display:flex;align-items:center;gap:14px;text-align:start;background:var(--panel);border:1.5px dashed var(--acc);border-radius:16px;padding:12px 16px;min-height:66px;width:100%}
.mode .ic{font-size:28px;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--panel2);flex:none}
.mode b{display:block;font-size:18px;font-family:var(--disp);font-weight:400}
.mode span{font-size:14px;color:var(--muted)}

/* ---------------- level map ---------------- */
#map .mapHead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
#map .mapHead b{font-family:var(--disp);font-weight:400;font-size:20px;color:var(--acc)}
#map .mapHead .btn{min-height:40px;padding:6px 12px;font-size:14px}
.trail{position:relative;margin:0 auto;width:100%;max-width:520px}
.trail svg.path{position:absolute;left:0;top:0;pointer-events:none}
.trail{direction:ltr}
.chap{position:absolute;left:12px;right:12px;text-align:center;font-family:var(--disp);font-size:20px;color:var(--ink)}
.chap span{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 16px}
.lvn{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:0;display:grid;place-items:center;font:400 24px/1 var(--disp);color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gc) 55%,#fff),var(--gc) 60%,color-mix(in srgb,var(--gc) 70%,#000));box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.3);padding:0}
.lvn .st{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:-1px;white-space:nowrap;direction:ltr;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.lvn .st i{font-style:normal;color:#ffd23f}
.lvn .st i.o{color:rgba(150,150,150,.6)}
.lvn.lock{background:var(--panel2);color:var(--muted);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);font-size:20px}
.lvn.cur{animation:curPulse 1.4s ease-in-out infinite;width:72px;height:72px;margin:-36px 0 0 -36px;font-size:28px}
@keyframes curPulse{50%{box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 0 0 8px color-mix(in srgb,var(--gc) 35%,transparent)}}
.lvn .who{position:absolute;bottom:72%;left:50%;transform:translateX(-50%);font-size:34px;line-height:1;animation:bob 2.4s ease-in-out infinite;pointer-events:none}
.lvn .who img.ai{width:52px;height:52px}

/* ---------------- game screen ---------------- */
#game{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#game.on{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "info" "board" "act"}
.gtop{grid-area:top;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.gtop .back{min-width:42px;height:40px}
.gtop .ttl{flex:1;font-size:13px;color:var(--muted);line-height:1.2;min-width:0}
.gtop .ttl b{display:block;font-family:var(--disp);font-weight:400;color:var(--ink);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px;flex:none}
.ginfo{grid-area:info;display:flex;justify-content:center;gap:8px;padding:6px 8px;background:var(--panel);flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:3px 12px;font-size:14px;white-space:nowrap}
.pill b{font:400 20px/1 var(--disp);color:var(--acc)}
.pill.goal b{color:#ffd23f}
.bwrap{grid-area:board;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:8px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--acc) 10%,var(--bg)),var(--bg) 75%)}
.bd{position:relative;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.status{position:absolute;top:6px;inset-inline:6px;display:flex;justify-content:center;pointer-events:none;z-index:30}
.status>span{background:rgba(0,0,0,.66);color:#fff;font-size:15px;padding:4px 14px;border-radius:20px;max-width:100%;text-align:center;opacity:0;transition:opacity .2s}
.status.on>span{opacity:1}
.gact{grid-area:act;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);align-items:center;border-top:1px solid var(--line)}
.gact .btn{flex:1;min-height:58px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:13px;line-height:1.15}
.gact .btn i{font-style:normal;font-size:24px;line-height:1.1}
.gact .btn.hintb{border-color:var(--hint);color:var(--hint)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti>i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}
@media (orientation:landscape) and (max-height:560px){
  #game.on{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "board info" "board act"}
  .ginfo{flex-direction:column;align-items:stretch;justify-content:center;border-inline-start:1px solid var(--line)}
  .gact{border-inline-start:1px solid var(--line);flex-wrap:wrap}
  .gact .btn{flex:1 1 40%}
}

/* ---------------- overlays ---------------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.ov>.box{background:var(--panel);border:1px solid var(--acc);border-radius:18px;max-width:520px;width:100%;max-height:calc(100dvh - 28px);overflow:auto;padding:18px}
.ov h2{font-size:26px;margin-bottom:6px}
.win{text-align:center}
.win .hero{font-size:84px;line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.win .hero img.ai{width:132px;height:132px}
.win .stars{display:flex;justify-content:center;gap:10px;font-size:54px;line-height:1;margin:8px 0 4px;direction:ltr}
.win .stars i{font-style:normal;filter:grayscale(1) opacity(.3);transform:scale(.4)}
.win .stars i.on{filter:none;animation:starIn .45s cubic-bezier(.2,1.7,.4,1) forwards}
.win .stars i.dim{animation:starDim .3s forwards}
@keyframes starIn{0%{transform:scale(.2) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes starDim{to{transform:scale(.8)}}
.win .stars i:nth-child(2){font-size:66px;margin-top:-10px}
.win p{margin:6px 0}
.win .btns{display:flex;flex-direction:column;gap:10px;margin-top:12px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.guide .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.guide .dots>i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.guide .dots>i.on{background:var(--acc)}
.guide .gbig{font-size:60px;text-align:center;line-height:1.1}
.rules p,.rules li{line-height:1.65}
.rules .rg{border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;margin-bottom:12px;background:var(--panel)}
.rules .rg>h2{font-size:22px;margin:8px 0 2px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat>div{background:var(--panel2);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-family:var(--disp);font-size:24px;font-weight:400;color:var(--acc)}
.stat span{font-size:12px;color:var(--muted)}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avs>button{padding:0;border:3px solid transparent;border-radius:50%;background:var(--panel2);aspect-ratio:1;font-size:24px;line-height:1}
.avs>button.on{border-color:var(--acc)}
.avs>button img.ai{width:108%;height:108%}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:6px}
.stk-i{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px dashed var(--line);border-radius:14px;padding:8px 4px;background:var(--panel2);font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.stk-i i{font-style:normal;font-size:30px;filter:grayscale(1) opacity(.35)}
.stk-i.got{border-style:solid;border-color:var(--acc);color:var(--ink)}
.stk-i.got i{filter:none;animation:pop .4s}
.stk-new{border:2px solid var(--acc);border-radius:14px;padding:8px 10px;margin:8px 0;background:color-mix(in srgb,var(--acc) 12%,var(--panel2))}
img.ai{width:1.2em;height:1.2em;object-fit:contain;vertical-align:-.28em;pointer-events:none;-webkit-user-drag:none;user-select:none}
.aif{display:inline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fast *{animation-duration:0s!important;transition-duration:0s!important}

/* ================= puzzle pieces ================= */
.pz{position:absolute;pointer-events:none}
.hit{position:absolute;pointer-events:auto}
/* ---- sort: tubes, poles, bolts ---- */
.tube{position:absolute;pointer-events:none;z-index:1}
.tube.sel{filter:drop-shadow(0 0 6px var(--acc2))}
.tube.hintFrom{filter:drop-shadow(0 0 8px var(--hint)) drop-shadow(0 0 3px var(--hint))}
.tube.hintTo::after{content:'⬇';position:absolute;left:50%;top:-30px;transform:translateX(-50%);color:var(--hint);font-size:26px;animation:bob 1s ease-in-out infinite}
.tube.done::before{content:'✓';position:absolute;left:50%;top:-26px;transform:translateX(-50%);color:var(--ok);font:400 22px var(--disp);animation:pop .4s}
.tube.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.it{position:absolute;z-index:2;pointer-events:none;transition:none;display:grid;place-items:center;color:rgba(255,255,255,.85);font-weight:700;line-height:1}
.it .sym{font-size:var(--sf,12px);text-shadow:0 1px 1px rgba(0,0,0,.45)}
.it.ring{border-radius:999px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff) 0%,var(--c) 38%,color-mix(in srgb,var(--c) 70%,#000) 100%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.35)}
.it.ring::before{content:'';position:absolute;left:50%;top:18%;bottom:18%;width:var(--hole,12%);transform:translateX(-50%);background:rgba(0,0,0,.28);border-radius:6px}
.it.water{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 75%,#000) 0%,var(--c) 30%,color-mix(in srgb,var(--c) 70%,#fff) 55%,var(--c) 75%,color-mix(in srgb,var(--c) 80%,#000) 100%)}
.it.water.bot{border-radius:0 0 999px 999px}
.it.water.top::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:rgba(255,255,255,.35);border-radius:2px}
.it.nuts{clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#fff) 0%,var(--c) 30%,var(--c) 65%,color-mix(in srgb,var(--c) 65%,#000) 100%)}
.it.nuts::after{content:'';position:absolute;left:50%;top:22%;bottom:22%;width:20%;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.2));border-radius:3px}
.it.nuts.hid{--c:#7d858f}
.it.nuts.hid .sym{font-size:var(--qf,16px);color:#fff;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.it.up{filter:drop-shadow(0 0 5px #fff)}
/* ---- 1.2 slide ---- */
.sl-bg{position:absolute;background:#10131c;border-radius:10px;box-shadow:inset 0 0 0 3px #2c3346}
.sl-t{position:absolute;border-radius:8%;background-color:hsl(var(--hue,200) 70% 55%);background-repeat:no-repeat;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.35);transition:left .13s ease-out,top .13s ease-out;display:grid;place-items:center;color:#fff;overflow:hidden;pointer-events:none}
.sl-t.num{background-image:linear-gradient(145deg,hsl(var(--hue) 80% 62%),hsl(var(--hue) 70% 42%))!important}
.sl-t b{font:400 1em var(--disp);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.sl-t i{position:absolute;top:3px;inset-inline-start:5px;font-style:normal;font-weight:800;line-height:1;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 5px;direction:ltr}
.sl-t.hole{opacity:0}
.sl-t.done{box-shadow:none;border-radius:0;transition:all .4s}
.sl-t.done i{display:none}
.sl-t.hint{box-shadow:inset 0 0 0 4px var(--hint),0 0 14px var(--hint);z-index:3}
.sl-t.shake{animation:shake .3s}
.sl-peek{position:absolute;z-index:20;border-radius:10px;background-repeat:no-repeat;animation:pop .2s;pointer-events:none;box-shadow:0 0 0 3px var(--acc)}
.sl-peekn{display:grid;width:100%;height:100%;background:#1e88e5;border-radius:10px}
.sl-peekn span{display:grid;place-items:center;color:#fff;font:400 22px var(--disp);border:1px solid rgba(255,255,255,.3)}
.pill.pbtn{cursor:pointer;color:var(--ink);font:inherit;font-size:14px}
/* ---- 1.2 lights ---- */
.lamp{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 40% 35%,#5a6274,#2a2f3c 70%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.4);transition:background .15s,box-shadow .15s}
.lamp::after{content:'';position:absolute;left:32%;top:26%;width:36%;height:36%;border-radius:50%;border:3px solid rgba(255,255,255,.12)}
.lamp.lit{background:radial-gradient(circle at 40% 35%,#fffde7,#ffeb3b 45%,#ffa000);box-shadow:0 0 18px 6px rgba(255,214,0,.55),inset 0 -4px 0 rgba(160,90,0,.35)}
.lamp.lit::after{border-color:rgba(255,160,0,.6)}
.lamp.pop{animation:lampPop .25s}
@keyframes lampPop{50%{transform:scale(.86)}}
.lamp.hint{outline:4px dashed var(--hint);outline-offset:4px}
/* ---- 1.2 pipes ---- */
.pipe{position:absolute;pointer-events:none}
.pipe svg{width:100%;height:100%;display:block}
.pipe .pi{position:absolute;inset:0;display:grid;place-items:center;line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.pipe.hint{outline:4px dashed var(--hint);outline-offset:-4px;border-radius:12px;z-index:3}
/* ---- 1.2 sokoban ---- */
.crate{position:absolute;pointer-events:none;transition:left .1s linear,top .1s linear;z-index:2}
.crate svg{width:100%;height:100%;display:block}
.crate.home{filter:drop-shadow(0 0 6px #ffd54f) brightness(1.12) saturate(1.3)}
.crate.home::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:400 1.4em var(--disp);text-shadow:0 2px 2px rgba(0,0,0,.6)}
.crate.hint{filter:drop-shadow(0 0 7px var(--hint)) drop-shadow(0 0 3px var(--hint));z-index:5}
.soko-me{position:absolute;pointer-events:none;transition:left .07s linear,top .07s linear;z-index:3;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#fff8,#fff0 70%);line-height:1}
.soko-me img.ai{width:100%;height:100%}
/* ---- 1.3 sudoku ---- */
.sd-c{position:absolute;display:grid;place-items:center;color:#1565c0;font-weight:700;cursor:pointer;line-height:1}
.sd-c.given{color:#1b1b1b;font-weight:800}
.sd-c.near{background:rgba(30,136,229,.08)}
.sd-c.same{background:rgba(255,193,7,.28)}
.sd-c.sel{background:rgba(30,136,229,.28)}
.sd-c.bad{color:#d32f2f;background:rgba(229,57,53,.14)}
.sd-c.hint{box-shadow:inset 0 0 0 3px var(--hint);animation:pop .3s}
.sd-c .ghost{opacity:.35}
.sd-n{display:grid;width:92%;height:92%;color:#546e7a;font-weight:600;text-align:center;align-items:center}
.sd-k{position:absolute;display:grid;place-items:center;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);color:var(--ink);font-weight:800;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.sd-k.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.sd-k.full{opacity:.35}
.sd-k.hint{box-shadow:0 0 0 3px var(--hint);animation:bob 1s ease-in-out infinite}
/* ---- 1.3 hanoi ---- */
.hn-d{position:absolute;pointer-events:none;border-radius:999px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 40%,color-mix(in srgb,var(--c) 70%,#000));box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.35);z-index:2}
.hn-d:has(>img.sp){background:none;box-shadow:none}
.hn-d img.sp{object-fit:fill;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.hn-d.up{filter:drop-shadow(0 0 6px #fff)}
.hit.hintPeg{background:rgba(89,195,255,.16);border-radius:16px;outline:3px dashed var(--hint);outline-offset:-6px}
/* ---- 1.3 rotate ---- */
.rt-t{position:absolute;pointer-events:none;border-radius:6px;background-repeat:no-repeat;background-color:#2b2f45;transition:transform .16s ease-out;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.rt-t.ok{box-shadow:0 0 0 1.5px rgba(255,255,255,.25)}
.rt-t.done{box-shadow:none;border-radius:0}
.rt-t.hint{box-shadow:0 0 0 4px var(--hint),0 0 14px var(--hint);z-index:3}
/* ---- 1.3 nonogram ---- */
.nn-c{position:absolute;pointer-events:none;display:grid;place-items:center;color:#e57373;line-height:1}
.nn-c.on{background:#37474f;box-shadow:inset 0 0 0 1px #fffdf6}
.nn-c.x::after{content:'✕'}
.nn-c.rev{box-shadow:none;transition:background .5s}
.nn-c.pend{outline:3px solid rgba(89,195,255,.7);outline-offset:-3px}
.nn-c.hint{outline:4px dashed var(--hint);outline-offset:-4px;z-index:3}
.nn-k{position:absolute;display:grid;place-items:center;color:var(--ink);font-weight:800;font-family:var(--body)}
.nn-k.done{opacity:.35}
.pill.pon{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,var(--panel2))}
/* ---- 1.2 drawn pieces (the CSS/SVG drawing stays underneath as the fallback) ---- */
.lamp:has(>img.sp){background:none;box-shadow:none}
.lamp:has(>img.sp)::after{display:none}
.lamp img.bon{opacity:0;transition:opacity .15s}
.lamp.lit img.bon{opacity:1}
.lamp.lit:has(>img.sp){filter:drop-shadow(0 0 10px rgba(255,214,0,.7))}
.pipe .pi img.pimg{width:1.5em;height:1.5em;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.crate:has(>img.sp)>svg{display:none}
.crate img.c1{opacity:0}
.crate.home img.c1{opacity:1}
.crate.home:has(>img.sp)::after{content:none}
/* 1.1 drawn pieces: when the picture is there the CSS shape steps aside */
img.sp{pointer-events:none;-webkit-user-drag:none;user-select:none}
img.sp.full{position:absolute;inset:0;width:100%;height:100%;display:block}
img.sp.rod{position:absolute;left:50%;bottom:0;height:100%;width:auto;transform:translateX(-50%)}
.it img.sp.pc{position:absolute;left:50%;bottom:0;width:var(--aw);height:auto;transform:translateX(-50%);filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.it:has(>img.sp){background:none;clip-path:none;box-shadow:none;overflow:visible}
.it:has(>img.sp)::before,.it:has(>img.sp)::after{display:none}
.it:has(>img.sp) .sym{position:relative;z-index:1}
.veh,.garage{overflow:visible}
.stream{position:absolute;width:8px;border-radius:4px;pointer-events:none;z-index:4;opacity:.9}
/* ---- parking + unblock vehicles ---- */
.veh{position:absolute;pointer-events:none;transform-origin:50% 50%;z-index:3}
.veh svg{width:100%;height:100%;display:block;overflow:visible}
.veh.hint{filter:drop-shadow(0 0 7px var(--hint)) drop-shadow(0 0 3px var(--hint));z-index:6}
.veh.sel{filter:drop-shadow(0 0 7px var(--acc2)) drop-shadow(0 0 3px #fff);z-index:6}
.veh.wob{animation:wob .3s}
@keyframes wob{30%{transform:var(--rt) scale(1.06)}60%{transform:var(--rt) scale(.97)}}
.arrowHint{position:absolute;z-index:7;pointer-events:none;color:var(--hint);font-size:30px;line-height:1;text-shadow:0 0 6px rgba(0,0,0,.6);animation:bob 1s ease-in-out infinite}
.garage{position:absolute;pointer-events:none;z-index:2}
.garage svg{width:100%;height:100%;display:block;overflow:visible}
.garage.got{animation:gotIt .5s}
@keyframes gotIt{40%{transform:scale(1.18)}}
.ghostSpot{position:absolute;border:3px dashed var(--hint);border-radius:10px;pointer-events:none;z-index:2;animation:pop .3s}

@keyframes cmb{0%{transform:translate(-50%,0) scale(.5);opacity:0}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}

<script>
/* ---- engines.js ---- */
/* =====================================================================
   PuzzleNest — engines. Pure: no DOM. The same file runs in the app and in Node
   (level generator + verifier), so "solvable" in the tests means solvable in the app.
   Every game registers ENG[id] with the same interface:
     parse(data) → P (a level)          init(P) → S (a state)
     apply(S, m) → S2 | null (pure)     won(S) → bool
     hint(S, P, budget) → move | null   (a move that is on a way to the end)
   Moves are small arrays, so a state + list of moves replays every step (undo).
   ===================================================================== */
const ENG = {};
const PZ = (() => {
  function rng(seed) {                                   // mulberry32
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const ri = (r, n) => Math.floor(r() * n);
  function shuffle(r, a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(r, i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  const clone = o => JSON.parse(JSON.stringify(o));
  // a small binary heap for best-first searches
  function Heap() { const h = []; return {
    get size() { return h.length; },
    push(p, v) { h.push([p, v]); let i = h.length - 1; while (i > 0) { const j = (i - 1) >> 1; if (h[j][0] <= h[i][0]) break; [h[i], h[j]] = [h[j], h[i]]; i = j; } },
    pop() { const top = h[0], last = h.pop(); if (h.length) { h[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < h.length && h[l][0] < h[m][0]) m = l; if (r < h.length && h[r][0] < h[m][0]) m = r; if (m === i) break; [h[i], h[m]] = [h[m], h[i]]; i = m; } } return top[1]; }
  }; }
  return { rng, ri, shuffle, clone, Heap };
})();

/* =====================================================================
   SORT family — rings (one ring per move), water and nuts (the whole top run
   of one colour moves, as much as fits). Nuts may start hidden ("?") until
   they are uncovered: hidden is only a picture, the colour is fixed.
   S = { cap, t: [[colour bottom→top] …], h: [[hidden?] …] | null }
   move = [from, to]
   ===================================================================== */
const SORT = (() => {
  const topRun = t => { if (!t.length) return 0; const c = t[t.length - 1]; let k = 1; while (k < t.length && t[t.length - 1 - k] === c) k++; return k; };
  function count(S, grp, i, j) {                    // how many items a move i→j carries (0 = illegal)
    const a = S.t[i], b = S.t[j];
    if (i === j || !a.length || b.length >= S.cap) return 0;
    if (b.length && b[b.length - 1] !== a[a.length - 1]) return 0;
    return grp ? Math.min(topRun(a), S.cap - b.length) : 1;
  }
  function apply(S, grp, m) {
    const [i, j] = m, k = count(S, grp, i, j); if (!k) return null;
    const t = S.t.map(x => x.slice()), h = S.h ? S.h.map(x => x.slice()) : null;
    for (let n = 0; n < k; n++) { t[j].push(t[i].pop()); if (h) { h[i].pop(); h[j].push(false); } }
    if (h && h[i].length) h[i][h[i].length - 1] = false;       // the nut under it is uncovered now
    return { cap: S.cap, t, h };
  }
  const done = (S, t) => !t.length || (t.length === S.cap && t.every(c => c === t[0]));
  const won = S => S.t.every(t => done(S, t));
  const key = S => S.t.map(t => t.join(',')).sort().join('|');
  // admissible lower bound (see notes in the requirements doc, part ל׳)
  function lb(S, grp) {
    let a = 0; const pre = {};
    for (const t of S.t) {
      if (!t.length) continue;
      let p = 1; while (p < t.length && t[p] === t[0]) p++;
      (pre[t[0]] || (pre[t[0]] = [])).push(p);
      if (grp) { let runs = 0; for (let i = p; i < t.length; i++) if (i === p || t[i] !== t[i - 1]) runs++; a += runs; }
      else a += t.length - p;
    }
    for (const c in pre) { const L = pre[c].sort((x, y) => y - x); for (let i = 1; i < L.length; i++) a += grp ? 1 : L[i]; }
    return a;
  }
  function moves(S, grp) {
    const out = [], n = S.t.length;
    for (let i = 0; i < n; i++) {
      const a = S.t[i]; if (!a.length || done(S, a)) continue;
      const uni = a.every(c => c === a[0]);
      let emptyTried = false;
      for (let j = 0; j < n; j++) {
        if (!count(S, grp, i, j)) continue;
        if (!S.t[j].length) { if (uni || emptyTried) continue; emptyTried = true; }   // one empty tube is like any other
        out.push([i, j]);
      }
    }
    return out;
  }
  // A* (w=1: shortest; w>1: fast, maybe longer). Returns the move list or null.
  function solve(S0, grp, budget, w) {
    w = w || 1; budget = budget || 2e6;
    const start = { cap: S0.cap, t: S0.t.map(x => x.slice()), h: null };
    if (won(start)) return [];
    const seen = new Map(), H = PZ.Heap(); let exp = 0;
    seen.set(key(start), 0);
    H.push(w * lb(start, grp), { S: start, g: 0, path: null });
    while (H.size) {
      const N = H.pop();
      if (seen.get(key(N.S)) < N.g) continue;
      if (++exp > budget) return null;
      for (const m of moves(N.S, grp)) {
        const S2 = apply(N.S, grp, m), g = N.g + 1, k = key(S2);
        const old = seen.get(k); if (old != null && old <= g) continue;
        seen.set(k, g);
        const node = { S: S2, g, path: { m, prev: N.path } };
        if (won(S2)) { const out = []; for (let p = node.path; p; p = p.prev) out.unshift(p.m); return out; }
        H.push(g + w * lb(S2, grp), node);
      }
    }
    return null;
  }
  return { count, apply, won, solve, moves, lb, key, topRun };
})();
function sortEngine(grp, hidden) {
  return {
    grp,
    // data: "cap;tube|tube|…" colours as letters a… ; hidden nuts: tube chars upper-case
    parse(d) {
      const [cap, tb] = d.split(';');
      const t = tb.split('|').map(s => s.split('').map(ch => ch.toLowerCase().charCodeAt(0) - 97));
      const h = hidden ? tb.split('|').map(s => s.split('').map(ch => ch !== ch.toLowerCase())) : null;
      return { cap: +cap, t, h, colors: Math.max(...t.flat()) + 1 };
    },
    init: P => ({ cap: P.cap, t: P.t.map(x => x.slice()), h: P.h ? P.h.map(x => x.slice()) : null }),
    apply: (S, m) => SORT.apply(S, grp, m),
    won: SORT.won,
    count: (S, i, j) => SORT.count(S, grp, i, j),
    solve: (S, budget, w) => SORT.solve(S, grp, budget, w),
    hint(S, P, budget) {
      let p = SORT.solve(S, grp, budget || 60000, 1);
      if (!p) p = SORT.solve(S, grp, budget || 60000, 3);
      return p && p.length ? p[0] : null;
    }
  };
}
ENG.ring = sortEngine(false, false);
ENG.water = sortEngine(true, false);
ENG.nuts = sortEngine(true, true);


/* =====================================================================
   UNBLOCK — slide cars and trucks along their own direction until the red car
   (vehicle 0) reaches the exit on the right of its row. A slide of any length = 1 move.
   data: 36 chars, '.' empty, 'x' wall, 'a' red car, 'b'… others (6×6, exit on row 2).
   S = { p: [position of each vehicle along its axis] }   move = [vehicle, newPos]
   ===================================================================== */
ENG.unblock = (() => {
  const N = 6, EXIT_ROW = 2;
  function parse(d) {
    const V = [], seen = {}, walls = [];
    for (let i = 0; i < 36; i++) {
      const ch = d[i]; if (ch === '.') continue;
      if (ch === 'x') { walls.push(i); continue; }
      if (seen[ch] != null) continue;
      const r = (i / N) | 0, c = i % N, h = c + 1 < N && d[i + 1] === ch;
      let len = 1; while (h ? (c + len < N && d[i + len] === ch) : (r + len < N && d[i + len * N] === ch)) len++;
      seen[ch] = V.length; V.push({ id: ch, h, len, fix: h ? r : c, pos: h ? c : r });
    }
    // vehicle 0 is always the red car
    V.sort((a, b) => (a.id === 'a' ? -1 : b.id === 'a' ? 1 : a.id < b.id ? -1 : 1));
    return { V, walls };
  }
  const init = P => ({ p: P.V.map(v => v.pos) });
  function grid(P, S) {
    const g = new Int8Array(36).fill(-1);
    for (const w of P.walls) g[w] = 99;
    P.V.forEach((v, k) => { for (let t = 0; t < v.len; t++) { const pp = S.p[k] + t; g[v.h ? v.fix * N + pp : pp * N + v.fix] = k; } });
    return g;
  }
  // every position vehicle k can reach in one slide
  function reach(P, S, k, g) {
    g = g || grid(P, S); const v = P.V[k], out = [];
    const cell = q => v.h ? v.fix * N + q : q * N + v.fix;
    for (let q = S.p[k] - 1; q >= 0 && g[cell(q)] === -1; q--) out.push(q);
    for (let q = S.p[k] + v.len; q < N && g[cell(q)] === -1; q++) out.push(q - v.len + 1);
    return out;
  }
  function apply(P, S, m) {
    const [k, to] = m; if (!reach(P, S, k).includes(to)) return null;
    const p = S.p.slice(); p[k] = to; return { p };
  }
  const won = (P, S) => S.p[0] + P.V[0].len === N;
  // shortest solution (BFS) — the boards are small enough
  function solve(P, S, budget) {
    budget = budget || 4e5;
    const k0 = S.p.join(','); if (won(P, S)) return [];
    const prev = new Map([[k0, null]]); let fr = [S];
    while (fr.length) {
      const nx = [];
      for (const s of fr) {
        const g = grid(P, s);
        for (let k = 0; k < P.V.length; k++) for (const to of reach(P, s, k, g)) {
          const p = s.p.slice(); p[k] = to; const key = p.join(',');
          if (prev.has(key)) continue;
          prev.set(key, [s.p.join(','), [k, to]]);
          if (p[0] + P.V[0].len === N) { const out = []; let c = key; while (prev.get(c)) { const [pk, m] = prev.get(c); out.unshift(m); c = pk; } return out; }
          if (prev.size > budget) return null;
          nx.push({ p });
        }
      }
      fr = nx;
    }
    return null;
  }
  return {
    N, EXIT_ROW, parse, init, grid, reach,
    apply: (S, m, P) => apply(P, S, m), won: (S, P) => won(P, S),
    solve: (P, S, b) => solve(P, S || init(P), b),
    hint(S, P) { const p = solve(P, S, 2e5); return p && p.length ? p[0] : null; }
  };
})();

/* =====================================================================
   PARKING — a jammed car park. Each vehicle drives only straight, forward or
   back. If the way out is clear it leaves the park and drives to the garage of its
   colour; if something is in the way it bumps and comes back (a wasted move).
   Cars are 2 long, buses 3. The puzzle is the ORDER: the shortest solution is one
   move per vehicle, every bump is an extra move.
   data: "W,H;x.y.len.axis.face.col …;cones"  axis h|v, face 1|0 (1 = towards +x/+y)
   S = { p: [position along axis, or null when it has left] }   move = [vehicle, dir ±1]
   ===================================================================== */
ENG.park = (() => {
  function parse(d) {
    const [wh, vs, cs] = d.split(';'); const [W, H] = wh.split(',').map(Number);
    const V = vs.split(' ').filter(Boolean).map(s => { const [x, y, len, ax, face, col] = s.split('.'); const h = ax === 'h'; return { h, len: +len, fix: h ? +y : +x, pos: h ? +x : +y, face: face === '1' ? 1 : -1, col: +col }; });
    const cones = (cs || '').split(' ').filter(Boolean).map(s => s.split('.').map(Number));
    return { W, H, V, cones };
  }
  const init = P => ({ p: P.V.map(v => v.pos) });
  function grid(P, S) {
    const g = new Int16Array(P.W * P.H).fill(-1);
    for (const [x, y] of P.cones) g[y * P.W + x] = 999;
    P.V.forEach((v, k) => { if (S.p[k] == null) return; for (let t = 0; t < v.len; t++) { const q = S.p[k] + t; g[v.h ? v.fix * P.W + q : q * P.W + v.fix] = k; } });
    return g;
  }
  // drive vehicle k in dir: { out: true } or { out: false, gap: free cells before the bump, by: what it hit }
  function drive(P, S, k, dir, g) {
    if (S.p[k] == null) return null;
    g = g || grid(P, S); const v = P.V[k], L = v.h ? P.W : P.H;
    const cell = q => v.h ? v.fix * P.W + q : q * P.W + v.fix;
    let q = dir > 0 ? S.p[k] + v.len : S.p[k] - 1, gap = 0;
    for (; q >= 0 && q < L; q += dir, gap++) if (g[cell(q)] !== -1) return { out: false, gap, by: g[cell(q)] };
    return { out: true, gap };
  }
  function apply(P, S, m) {
    const r = drive(P, S, m[0], m[1]); if (!r || !r.out) return null;
    const p = S.p.slice(); p[m[0]] = null; return { p };
  }
  const won = S => S.p.every(x => x == null);
  // leaving never blocks anybody, so peeling free vehicles off is always right
  function exits(P, S) {
    const g = grid(P, S), out = [];
    P.V.forEach((v, k) => { if (S.p[k] == null) return; for (const d of [v.face, -v.face]) { const r = drive(P, S, k, d, g); if (r.out) { out.push([k, d]); break; } } });
    return out;
  }
  function solve(P, S) {
    S = S || init(P); const path = []; let rounds = 0;
    while (!won(S)) {
      const ex = exits(P, S); if (!ex.length) return null;
      rounds++;
      for (const m of ex) { const S2 = apply(P, S, m); if (S2) { S = S2; path.push(m); } }
    }
    path.rounds = rounds; return path;
  }
  return {
    parse, init, grid, drive, exits,
    apply: (S, m, P) => apply(P, S, m), won: S => won(S),
    solve: (P, S) => solve(P, S),
    // hint: a vehicle that can leave now — the one that frees the most others
    hint(S, P) {
      const ex = exits(P, S); if (!ex.length) return null;
      let best = ex[0], bv = -1;
      for (const m of ex) { const n = exits(P, apply(P, S, m)).length; if (n > bv) { bv = n; best = m; } }
      return best;
    }
  };
})();

/* =====================================================================
   BLOCKS — place shapes on an 8×8 board; a full row or column disappears.
   Levels: some squares start filled and some carry a ⭐; clear every ⭐.
   Endless: an empty board, keep going until no shape fits; the score is the record.
   The shapes come from a stream fixed by the level's seed, three at a time,
   so the solver and the player see exactly the same shapes.
   S = { b:[64 colour|0], gem:[64 0|1], tray:[shape|-1 ×3], next, seed, score, lines, placed, combo }
   move = [tray slot, row, col]
   ===================================================================== */
ENG.blocks = (() => {
  const N = 8;
  // shapes as [row, col] cells; w = how often it comes
  const SH = [
    [[[0, 0]], 3], [[[0, 0], [0, 1]], 4], [[[0, 0], [1, 0]], 4], [[[0, 0], [0, 1], [0, 2]], 4], [[[0, 0], [1, 0], [2, 0]], 4],
    [[[0, 0], [0, 1], [0, 2], [0, 3]], 3], [[[0, 0], [1, 0], [2, 0], [3, 0]], 3], [[[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]], 2], [[[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]], 2],
    [[[0, 0], [0, 1], [1, 0], [1, 1]], 5], [[[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]], 1],

  ru_hashi: '<p>על הלוח איים עם מספרים. מחברים אותם בגשרים <b>ישרים</b> (לרוחב או לגובה): בין שני איים — גשר אחד או שניים. הקשה בין שני איים מוסיפה גשר (1 → 2 → בלי).</p><p>המספר באי = כמה גשרים יוצאים ממנו. גשרים לא חוצים זה את זה, ובסוף <b>כל האיים מחוברים</b>. אי שהשלים את המספר שלו נצבע ירוק.</p>',
  ru_sudoku: '<p>ממלאים את הלוח כך שבכל <b>שורה</b>, בכל <b>עמודה</b> ובכל <b>ריבוע</b> מודגש כל סימן מופיע פעם אחת בדיוק. לילדים: 4×4 ו-6×6, ואפשר לשחק עם 🍎 פירות במקום מספרים.</p><p>בוחרים משבצת ואז סימן (או סימן ואז משבצות). ✏️ — הערות קטנות. ⌫ — מחיקה. כפילות נצבעת באדום.</p>',
  ru_hanoi: '<p>מעבירים את כל הטבעות למוט המסומן ב-⭐. בכל פעם מזיזים <b>טבעת אחת</b> — העליונה — ואסור לשים טבעת <b>גדולה על קטנה</b>.</p><p>הקישו על מוט ואז על מוט אחר. בשלבים מסוימים הטבעות מתחילות מפוזרות, ויש 4 מוטות.</p>',
  ru_rotate: '<p>חלקי התמונה מסובבים. הקישו על חלק — הוא מסתובב רבע סיבוב. מסובבים עד שכל התמונה ישרה.</p><p>בשלבים עם 🔗 כל הקשה מסובבת <b>גם את ארבעת השכנים</b> — כאן צריך לחשוב! תמונות: ילדים, נופים, משפטים או שלכם.</p>',
  ru_nono: '<p>ליד כל שורה ומעל כל עמודה יש מספרים: כמה משבצות צבועות יש ברצף, ובאיזה סדר. למשל "3 1" = שלוש צבועות, רווח, ואחת.</p><p>צובעים ⬛ לפי ההיגיון ומסמנים ✖ משבצות שבטוח ריקות (סימון לא נספר). אפשר לגרור על כמה משבצות. בסוף מתגלה <b>תמונה צבעונית</b>! 🎨</p>',
  g_tangram: 'טנגרם', g_line: 'קו אחד', g_maze: 'מבוך', g_kakuro: 'קקורו', g_mmind: 'קוד סודי', g_mines: 'שולה המוקשים',
  tangramGoal: 'מלאו את הצל בחלקים. גוררים חלק ללוח, הקשה על חלק במגש מסובבת אותו', tanTap: 'הקשה = סיבוב', tanOut: 'החלק הזה במקום לא נכון — הקישו עליו כדי להחזיר אותו',
  lineGoal: 'עברו על כל הקווים — כל קו פעם אחת, בלי להרים את האצבע. מתחילים מנקודה וגוררים', stuck_line: 'נתקעת — אין קו להמשיך בו', stuckD_line: 'בטלו כמה צעדים ונסו דרך אחרת, או התחילו מנקודה אחרת.',
  mazeGoal: 'הביאו את החיה הביתה 🏠 — גוררים או מקישים בשביל', mazeHome: 'הביתה',
  kakuroGoal: 'כמו תשבץ של מספרים: כל שורה וכל עמודה לבנה מסתכמת במספר שבמשבצת הכהה, בלי ספרה פעמיים',
  mmindGoal: 'נחשו את הקוד הסודי! בוחרים צבעים ולוחצים "בדוק". ⚫ = צבע נכון במקום נכון · ⚪ = צבע נכון במקום אחר', mmFirst: 'בחרו צבעים למטה ולחצו "בדוק"', mmCheck: 'בדוק', mmTry: 'נסו את הקוד הזה ולחצו "בדוק"', mmBlack: 'במקום', mmWhite: 'צבע נכון', mmFill: 'מלאו את כל העיגולים', noUndo: 'בקוד הסודי אין ביטול — ניחוש הוא ניחוש 🙂',
  minesGoal: 'גלו את כל המשבצות הבטוחות. המספר אומר כמה מוקשים נוגעים בו. לחיצה ארוכה = דגל 🚩', minesFlag: 'דגל', minesFlagged: 'יש פה דגל — הורידו אותו קודם', stuck_mines: 'בום! זה היה מוקש', stuckD_mines: 'בטלו את הצעד — המספרים מספיקים כדי לדעת איפה בטוח, בלי לנחש.',
  st_tangram10: 'אמן הצורות', std_tangram10: 'לסיים 10 שלבים בטנגרם', st_line10: 'יד יציבה', std_line10: 'לסיים 10 שלבים בקו אחד', st_maze10: 'מוצא הדרך', std_maze10: 'לסיים 10 מבוכים', st_kakuro10: 'מחשבון', std_kakuro10: 'לסיים 10 שלבים בקקורו', st_mmind10: 'פורץ קודים', std_mmind10: 'לפצח 10 קודים סודיים', st_mines10: 'חבלן', std_mines10: 'לנקות 10 שדות מוקשים',
  st_week1: 'משימה ראשונה', std_week1: 'להשלים משימה שבועית', st_album24: 'אספן', std_album24: 'לאסוף 24 קלפים באלבום',
  ru_tangram: '<p>על הלוח צל של צורה. ממלאים אותו בחלקים שבמגש — <b>כל החלקים</b>, בלי חפיפה ובלי לצאת מהצל.</p><p>גוררים חלק ללוח. הקשה על חלק במגש מסובבת אותו (המקבילית גם מתהפכת). הקשה על חלק שעל הלוח מחזירה אותו למגש. כל הנחה = מהלך; ⭐⭐⭐ = כל חלק במקומו בניסיון הראשון.</p>',
  ru_line: '<p>מציירים את כל הקווים <b>בקו אחד</b>: מתחילים בנקודה, וגוררים מנקודה לנקודה — כל קו פעם אחת בלבד, בלי להרים את האצבע.</p><p>טיפ: אם יש נקודות שיוצאים מהן מספר אי-זוגי של קווים — מתחילים באחת מהן. נתקעתם? בטלו כמה צעדים.</p>',
  ru_maze: '<p>מובילים את החיה הביתה 🏠. גוררים את האצבע בשביל, או מקישים על משבצת בקו ישר. השביל הצהוב מראה את הדרך; חזרה אחורה מוחקת אותו.</p><p>כל משבצת = מהלך. ⭐⭐⭐ = הדרך הקצרה ביותר.</p>',
  ru_kakuro: '<p>תשבץ של מספרים. במשבצת כהה יש סכום: המספר <b>למעלה מימין</b> — לשורה שמימינו, <b>למטה משמאל</b> — לעמודה שמתחתיו.</p><p>ממלאים ספרות 1–9 כך שכל שורה ועמודה לבנה מסתכמת בדיוק בסכום, <b>בלי ספרה פעמיים</b> באותה שורה או עמודה. טיפ: 3 בשתי משבצות = רק 1+2!</p>',
  ru_mmind: '<p>המחשב החביא קוד של עיגולים צבעוניים. מנחשים: בוחרים צבעים ולוחצים "בדוק".</p><p>⚫ = צבע נכון <b>במקום הנכון</b> · ⚪ = צבע נכון במקום אחר. משתמשים ברמזים כדי לפצח את הקוד בכמה שפחות ניחושים. בשלבים הראשונים אין צבע פעמיים; בהמשך — יכול להיות.</p>',
  ru_mines: '<p>מתחת למשבצות מוסתרים מוקשים 💣. המספר במשבצת פתוחה = כמה מוקשים נוגעים בה (גם באלכסון).</p><p>מקישים כדי לפתוח משבצת בטוחה; לחיצה ארוכה (או כפתור 🚩) שמה דגל. <b>כל לוח נפתר בהיגיון</b> מהמשבצת הירוקה — אף פעם לא צריך לנחש. עליתם על מוקש? אפשר לבטל.</p>',

  a_disc: 'PuzzleNest is a collection of classic puzzles in our own design. The puzzle types are well known; the levels, drawings and names are ours, and the app is not affiliated with any other app, brand or maker. Every level was checked by a computer solver. For fun only — no ads, no purchases, no internet needed.',
  shareTxt: '{n} invites you to play PuzzleNest — puzzles for the whole family!', copied: 'Link copied',
  g1t: 'Welcome to PuzzleNest', g1d: 'Twenty-two puzzle games: parking, sorting, nuts, blocks, flow, slide puzzle, lights, pipes, warehouse, bridges, sudoku, Hanoi, turn the picture, hidden picture, tangram, one line, maze, kakuro, secret code and minesweeper — for every age.',
  g2t: 'Hundreds of levels, easy to hard', g2d: 'Every game is a map of 200 levels. Solve in few moves to get up to 3 stars ⭐⭐⭐.',
  g3t: 'You can never get stuck', g3d: '↩️ undoes a move (as many as you like), 🔄 starts over, and 💡 shows the right next step.',
  g4t: 'Daily challenge', g4d: 'A special level every day. Solve it several days in a row — 🔥 your streak grows!',
  g5t: 'Pick an animal', g5d: 'Tap the picture at the top to choose a name and an animal. Collect stickers 🏅 for achievements!',
  starsTitle: 'Stars', ru_stars: '<p>The computer solved every level and found the fewest moves. Solve it in that many — ⭐⭐⭐. A few more — ⭐⭐. Solved — ⭐. Undo also takes the counter back, so you can always try again.</p>',
  ru_park: '<p>The car park is jammed! Every vehicle drives only <b>straight</b> — forward or back. Tap a vehicle and it drives forward; swipe it to choose the direction.</p><p>If the way is clear it leaves and drives to the garage of its colour 🏠. If something is in the way — bump! It comes back and that costs a move. The long bus takes 3 squares.</p><p>The secret is the <b>order</b>. Best = one move per vehicle.</p>',
  ru_ring: '<p>Tap a pole — the top ring lifts. Tap another pole to put it there.</p><p>You may only put it <b>on the same colour</b> or on an <b>empty pole</b>, and only if there is room. Goal: one colour on every pole ✓.</p>',
  ru_water: '<p>Tap a tube, then another tube to pour. The whole top layer of one colour pours — as much as fits.</p><p>Pour only <b>onto the same colour</b> or into an <b>empty</b> tube. Goal: every tube one colour ✓.</p>',
  ru_nuts: '<p>Tap a bolt, then another bolt: all the top nuts of one colour move together, as many as fit.</p><p>Only <b>onto the same colour</b> or onto an <b>empty bolt</b>. Nuts with a <b>?</b> show their colour when what is above them is gone. Goal: one colour on every bolt ✓.</p>',
  ru_unblock: '<p>The red car ⭐ must leave through the gap on the right ➜. Drag cars and trucks <b>only along their own direction</b> to clear its way.</p><p>You can also tap a vehicle (the places it can go light up) and then tap a place. Each slide is one move, however far.</p>',
  ru_blocks: '<p>Drag shapes from below onto the board (or tap a shape, then the board). A full row or column <b>disappears</b> ✨.</p><p><b>Levels:</b> clear every star ⭐ — a star goes when its row or column fills. Stars are given for how few shapes you used.</p><p><b>Endless:</b> keep going until no shape fits. Several lines at once = more points 🔥.</p>',
  ru_flow: '<p>Drag a line from a dot to the dot of the <b>same colour</b>. Lines never cross — a new line cuts an old one in its way.</p><p>Join every pair <b>and fill the whole board</b> 🌈. A move counts when you switch to another colour; best = one move per colour.</p>',
  picsOffline: 'Pictures offline', picsOfflineD: 'Puzzle pictures (about 11 MB) download when you pick them. You can get them all now — Wi-Fi is best — and then they work without internet.', picsGet: 'Download all pictures', picsDone: 'All pictures are on this phone',

/* =====================================================================
   PuzzleNest — app core (storage · settings · screens · sound · confetti · art)
   Shell taken from FamilyNest 1.3 (themes, day/night, storage shim, sounds, art fallback).
   ===================================================================== */
const APP_VERSION = '1.4.0';
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// players on this phone: each one keeps their own progress under their own key prefix (player 0 = the original keys)
const PROFS = (() => { try { const v = JSON.parse(localStorage.getItem('pzg_profiles')); if (v && v.list && v.list.length) return v; } catch (e) {} return { cur: 0, list: [{ id: 0 }] }; })();
const P_ = PROFS.cur ? 'pzp' + PROFS.cur + '_' : 'puzzle_';
const saveProfs = () => { try { localStorage.setItem('pzg_profiles', JSON.stringify(PROFS)); } catch (e) {} };
const FAST = /[?&]fast=1/.test(location.search);
const GAME_IDS = ['park', 'ring', 'water', 'nuts', 'unblock', 'blocks', 'flow', 'slide', 'lights', 'pipes', 'soko', 'hashi', 'sudoku', 'hanoi', 'rotate', 'nono', 'tangram', 'line', 'maze', 'kakuro', 'mmind', 'mines'];
const GICON = { park: '🚗', ring: '🍩', water: '🧪', nuts: '🔩', unblock: '🚙', blocks: '🧱', flow: '🌈', slide: '🧩', lights: '💡', pipes: '🚰', soko: '📦', hashi: '🌉', sudoku: '🔢', hanoi: '🗼', rotate: '🔄', nono: '🎨', tangram: '🔷', line: '✏️', maze: '🌀', kakuro: '➕', mmind: '🔐', mines: '💣' };
// puzzle colours (12) + a symbol for each, for people who don't see every colour
const PAL = ['#e53935', '#1e88e5', '#fdd835', '#43a047', '#8e24aa', '#fb8c00', '#ec407a', '#00acc1', '#795548', '#9ccc65', '#3f51b5', '#eceff1'];
const SYM = ['●', '■', '▲', '◆', '★', '✚', '♥', '⬟', '✖', '☾', '✿', '◉'];
const SYMDARK = [false, false, true, false, false, false, false, false, false, true, false, true];

/* ---------- storage shim: localStorage with an in-memory fallback ---------- */
const LS = (() => {
  const mem = {}; let ok = true;
  try { localStorage.setItem(P_ + 't', '1'); localStorage.removeItem(P_ + 't'); } catch (e) { ok = false; }
  return {
    get(k, d) { try { const v = ok ? localStorage.getItem(P_ + k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const s = JSON.stringify(v); try { if (ok) localStorage.setItem(P_ + k, s); else mem[k] = s; return true; } catch (e) { toast(T('saveFail')); return false; } },
    del(k) { try { if (ok) localStorage.removeItem(P_ + k); else delete mem[k]; } catch (e) {} },
    keys() { const out = []; try { if (ok) for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(P_)) out.push(k.slice(P_.length)); } else out.push(...Object.keys(mem)); } catch (e) {} return out; }
  };
})();

const ST = Object.assign({ name: '', lang: 'he', theme: 'gold', mode: 'night', sound: true, vib: true, sym: false, guided: false, avatar: 0, slidePic: 'kids', slideNum: true, rotPic: 'kids', sudoSym: 'num' }, LS.get('settings', {}));
const saveST = () => { LS.set('settings', ST); const me = PROFS.list.find(p => p.id === PROFS.cur); if (me && (me.name !== ST.name || me.av !== ST.avatar)) { me.name = ST.name; me.av = ST.avatar; saveProfs(); } };
// things shared by every player on the phone (gallery photos, the picture cache flag)
const LSG = { get: (k, d) => { try { const v = localStorage.getItem('puzzle_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem('puzzle_' + k, JSON.stringify(v)); return true; } catch (e) { toast(T('saveFail')); return false; } } };
// progress: PROG[game] = { s: {level: stars}, b: {level: best moves}, nh: levels without hints }
const PROG = LS.get('prog', {});
const saveProg = () => LS.set('prog', PROG);
const prog = g => PROG[g] || (PROG[g] = { s: {}, b: {} });
// daily: { last: 'YYYY-MM-DD' of the last daily done, streak, best, done: {date: stars} }
const DAILY = Object.assign({ last: '', streak: 0, best: 0, done: {} }, LS.get('daily', {}));
const saveDaily = () => LS.set('daily', DAILY);
// misc counters for stickers + the endless record
const CNT = Object.assign({ cars: 0, nohint: 0, endlessBest: 0, played: {} }, LS.get('cnt', {}));
const saveCnt = () => LS.set('cnt', CNT);

/* ---------- i18n ---------- */
const T = (k, o) => {
  const L = LANG[ST.lang] || LANG.en;
  let s = L[k] != null ? L[k] : (LANG.en[k] != null ? LANG.en[k] : (LANG.he[k] != null ? LANG.he[k] : k));
  if (o) for (const x in o) s = s.split('{' + x + '}').join(o[x]);
  return s;
};
const RTL = () => ST.lang === 'he' || ST.lang === 'ar';
const gname = g => T('g_' + g);
function applyLang() {
  document.documentElement.lang = ST.lang; document.documentElement.dir = RTL() ? 'rtl' : 'ltr';
  $$('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  $$('.back').forEach(b => b.textContent = RTL() ? '→' : '←');
}
function applyLook() {
  const d = document.documentElement;
  d.dataset.theme = ST.theme; d.dataset.mode = ST.mode;
  d.classList.toggle('fast', FAST);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = ST.mode === 'day' ? '#f4f2ec' : '#0a0a0a';
}
const THEMES = ['gold', 'silver', 'emerald', 'ruby', 'ocean'];

/* ---------- screens + toast + overlays ---------- */
let SCREEN = 'home';
function show(id) {
  $$('.scr').forEach(s => s.classList.toggle('on', s.id === id)); SCREEN = id; window.scrollTo(0, 0);
  if (id === 'game') requestAnimationFrame(() => { if (typeof fitBoard === 'function') fitBoard(); });
}
let toastT = null;
function toast(msg, ms) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2600); }
function overlay(html, cls) {
  const o = document.createElement('div'); o.className = 'ov ' + (cls || ''); o.innerHTML = '<div class="box">' + html + '</div>';
  $('#ovs').appendChild(o); return o;
}
const closeOv = o => { if (o && o.parentNode) o.parentNode.removeChild(o); };
const anyOv = () => $('#ovs').children.length > 0;
function closeAllOv() { $('#ovs').innerHTML = ''; }
function confirmBox(msg, yes, cb) {
  const o = overlay('<p style="font-size:17px">' + esc(msg) + '</p><div class="row" style="margin-top:12px"><button class="btn" data-n>' + T('cancel') + '</button><button class="btn main" data-y>' + esc(yes || T('ok')) + '</button></div>');
  o.querySelector('[data-n]').onclick = () => closeOv(o);
  o.querySelector('[data-y]').onclick = () => { closeOv(o); cb(); };
}

/* ---------- the player's animal (FamilyNest art, emoji fallback) ---------- */
const AVATARS = ['🦁', '🐼', '🐸', '🦊', '🐵', '🐨', '🐯', '🐰', '🐶', '🐱', '🦄', '🐙', '🐧', '🐢', '🦉', '🐻'];
const AV_IDS = ['lion', 'panda', 'frog', 'fox', 'monkey', 'koala', 'tiger', 'rabbit', 'dog', 'cat', 'unicorn', 'octopus', 'penguin', 'turtle', 'owl', 'bear'];
const avOf = n => AVATARS[((n || 1) - 1 + AVATARS.length) % AVATARS.length];
const myAv = () => ST.avatar || 1 + Array.from(String(ST.name || '')).reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7) % AVATARS.length;
let ART_ON = !/[?&]noart=1/.test(location.search);
function artFail(im) { const s = document.createElement('span'); s.className = 'aif'; s.textContent = im.alt; im.replaceWith(s); }
const imgTag = (src, alt, cls) => ART_ON ? '<img class="' + (cls || 'ai') + '" src="' + src + '" alt="' + alt + '" draggable="false" onerror="artFail(this)">' : alt;
const avHTML = (n, joy) => { const i = ((n || 1) - 1 + AVATARS.length) % AVATARS.length; return imgTag('av-' + AV_IDS[i] + (joy ? '-joy' : '') + '.webp', AVATARS[i]); };
const ART_FILES = AV_IDS.flatMap(a => ['av-' + a + '.webp', 'av-' + a + '-joy.webp']);
// 1.1 game pieces from the second AI: every picture falls back to the drawing in code if its file is missing
const COLN = ['red', 'blue', 'yellow', 'green', 'purple', 'orange', 'pink', 'cyan', 'brown', 'lime', 'indigo', 'white'];
const FB = {};
function artOr(src, fb, cls, style) {
  if (!ART_ON) return fb;
  FB[src] = fb;
  return '<img class="sp ' + (cls || '') + '" src="' + src + '" alt="" draggable="false" data-fb="' + src + '"' + (style ? ' style="' + style + '"' : '') + ' onerror="artSwap(this)">';
}
function artSwap(im) { const f = FB[im.dataset.fb]; if (f) im.outerHTML = f; else im.remove(); }
// one probe at start: if the drawings are not there, emoji everywhere
function artProbe(done) {
  if (!ART_ON) return;
  const i = new Image(); i.onerror = () => { ART_ON = false; if (done) done(); }; i.src = 'av-lion.webp';
}

/* ---------- sound (synthesised, no files) + vibration ---------- */
let AC = null;
function beep(kind, p) {
  if (!ST.sound || FAST) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();

UI.blocks = (() => {
  const N = 8, BCOL = ['', '#e53935', '#1e88e5', '#fdd835', '#43a047', '#8e24aa', '#fb8c00', '#00acc1', '#ec407a', '#8d8f99'];

    layout(C, W, H) {

      C.el.querySelectorAll('.pz,.bcell,.tray,.cmb').forEach(e => e.remove());
      let g = '<svg class="pz" width="' + G.W + '" height="' + (N + .4) * cs + '" style="left:0;top:0"><rect x="0" y="0" width="' + G.W + '" height="' + (N + .4) * cs + '" rx="' + cs * .3 + '" fill="#2b2f45"/>';

        e.style.background = '';

/* ================= Slide (פאזל הזזה) ================= */
UI.slide = (() => {
  const R = {
    start(C) {
      let kind = ST.slidePic || 'kids'; if (kind === 'mine' && !myPhotos().length) kind = 'kids';
      C.x.kind = kind; C.x.pk = C.i + (C.mode === 'daily' ? 3 : 0);
    },
    mount(C) { C.ui = { tiles: {} }; },
    layout(C, W, H) {
      const P = C.P, ts = Math.min(W / P.C, H / P.R, 120), G = C.ui.g = { ts, W: ts * P.C, H: ts * P.R };
      C.el.style.width = px(G.W); C.el.style.height = px(G.H);
      C.el.innerHTML = ''; C.ui.tiles = {};
      C.el.insertAdjacentHTML('afterbegin', '<div class="pz sl-bg" style="left:0;top:0;width:' + px(G.W) + ';height:' + px(G.H) + '"></div>');
      setPic(C);
      if (!C.ui.bound) { C.ui.bound = true; bind(C); }
    },
    draw(C) {
      const P = C.P, G = C.ui.g; if (!G) return;
      const won = ENG.slide.won(C.S, P), num = C.x.kind === 'num' || !C.ui.url;
      C.S.t.forEach((t, i) => {
        let el = C.ui.tiles[t];
        if (!el) { el = mk(C.el, 'sl-t'); el.dataset.tile = t; C.ui.tiles[t] = el; }
        const hole = t === P.n - 1;
        el.classList.toggle('hole', hole && !won);
        el.classList.toggle('done', won);
        place(el, (i % P.C) * G.ts, ((i / P.C) | 0) * G.ts, G.ts, G.ts);
        const gr = (t / P.C) | 0, gc = t % P.C;
        if (num) { el.style.backgroundImage = ''; el.style.setProperty('--hue', (gr * 360 / P.R + gc * 18) % 360); }
        else { el.style.backgroundImage = 'url("' + C.ui.url + '")'; el.style.backgroundSize = px(G.bw) + ' ' + px(G.bh); el.style.backgroundPosition = px(-(gc * G.ts + G.ox)) + ' ' + px(-(gr * G.ts + G.oy)); }
        el.classList.toggle('num', num);
        const lab = num ? '<b>' + (t + 1) + '</b>' : (ST.slideNum !== false ? '<i>' + (t + 1) + '</i>' : '');
        if (el._l !== lab) { el._l = lab; el.innerHTML = lab; }
        el.style.fontSize = px(G.ts * (num ? .42 : .2));
      });
    },
    async anim(C, prev, m) { beep('slide'); R.draw(C); await wait(140); },
    hintShow(C, m) { R.hintClear(C); const t = C.S.t[m[0]], el = C.ui.tiles[t]; if (el) el.classList.add('hint'); },
    hintClear(C) { if (C.ui && C.ui.tiles) Object.values(C.ui.tiles).forEach(e => e.classList.remove('hint')); },
    pills(C) { return '<button class="pill pbtn" data-pk="peek">👁 ' + T('peek') + '</button>' + (C.x.kind !== 'num' && picCount(C.x.kind) > 1 ? '<button class="pill pbtn" data-pk="next">🖼️ ' + T('otherPic') + '</button>' : ''); },
    pillTap(C, k) {
      if (k === 'next') { C.x.pk++; setPic(C); R.draw(C); saveCur(); return; }
      if (k === 'peek') {
        const G = C.ui.g, o = mk(C.el, 'sl-peek'); place(o, 0, 0, G.W, G.H);
        if (C.ui.url && C.x.kind !== 'num') { o.style.backgroundImage = 'url("' + C.ui.url + '")'; o.style.backgroundSize = px(G.bw) + ' ' + px(G.bh); o.style.backgroundPosition = px(-G.ox) + ' ' + px(-G.oy); }
        else o.innerHTML = '<div class="sl-peekn" style="grid-template-columns:repeat(' + C.P.C + ',1fr)">' + [...Array(C.P.n - 1).keys()].map(t => '<span>' + (t + 1) + '</span>').join('') + '<span></span></div>';
        setTimeout(() => o.remove(), FAST ? 0 : 1800);

    },
    intro(C) { if (C.i < 2) status(T('slideGoal'), 2600); }
  };

  }

      const [x, y] = bpt(C, e), G = C.ui.g, c = Math.floor(x / G.ts), r = Math.floor(y / G.ts);

    });
  }

})();

UI.hashi = (() => {
  const R = {
    mount(C) { C.ui = {}; },
    layout(C, W, H) {
      const P = C.P, cs = Math.min(W / P.W, H / P.H, 70), G = C.ui.g = { cs, W: cs * P.W, H: cs * P.H };

      for (let y = 0; y < P.H; y++) for (let x = 0; x < P.W; x++) g += '<circle cx="' + (x + .5) * cs + '" cy="' + (y + .5) * cs + '" r="1.6" fill="rgba(255,255,255,.18)"/>';

      let h = '';
      P.E.forEach((e, i) => {
        const n = C.S.c[i]; if (!n && C.x.hint !== i) return;
        const [x1, y1] = ctr(e.a), [x2, y2] = ctr(e.b), off = n === 2 ? cs * .1 : 0, ox = e.h ? 0 : off, oy = e.h ? off : 0;
        const ln = (dx, dy, col, w, dash) => '<line x1="' + (x1 + dx) + '" y1="' + (y1 + dy) + '" x2="' + (x2 + dx) + '" y2="' + (y2 + dy) + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"' + (dash ? ' stroke-dasharray="' + cs * .15 + ' ' + cs * .12 + '"' : '') + '/>';
        if (n) { h += ln(ox, oy, '#5d4037', cs * .12) + ln(ox, oy, '#c8a165', cs * .07); if (n === 2) h += ln(-ox, -oy, '#5d4037', cs * .12) + ln(-ox, -oy, '#c8a165', cs * .07); }

    hintClear(C) { if (C.x) { C.x.hint = null; if (C.ui && C.ui.g) R.draw(C); } },
    pills(C) { const P = C.P, n = P.I.filter((p, k) => ENG.hashi.load(C.S, P, k) === p.n).length; return '<span class="pill">🏝️ <b class="ltr">' + n + '/' + P.I.length + '</b></span>'; },

/* ================= Hanoi (מגדלי הנוי) ================= */
UI.hanoi = (() => {
  const R = {
    start(C) { C.x.sel = -1; },
    mount(C) { C.ui = { discs: [] }; },
    layout(C, W, H) {
      const P = C.P, colW = Math.min(W / P.k, 190), dh = Math.min((H - 40) / (P.n + 3), colW * .22, 34), G = C.ui.g = { colW, dh, W: colW * P.k, H: dh * (P.n + 3) + 20 };
      G.base = G.H - 26;
      C.el.style.width = px(G.W); C.el.style.height = px(G.H); C.el.innerHTML = '';
      let g = '<svg class="pz" width="' + G.W + '" height="' + G.H + '" style="left:0;top:0">';
      for (let p = 0; p < P.k; p++) {
        const x = (p + .5) * colW, top = G.base - dh * (P.n + 1.2);
        g += '<rect x="' + (x - 5) + '" y="' + top + '" width="10" height="' + (G.base - top) + '" rx="5" fill="#b07a45"/><rect x="' + (x - colW * .45) + '" y="' + G.base + '" width="' + colW * .9 + '" height="12" rx="6" fill="#8d5a2b"/>';
        if (p === P.t) g += '<text x="' + x + '" y="' + (G.base + 26) + '" text-anchor="middle" font-size="16">⭐</text>';
      }
      C.el.insertAdjacentHTML('afterbegin', g + '</svg>');
      C.ui.discs = [...Array(P.n).keys()].map(d => { const e = mk(C.el, 'hn-d'); const w = colW * (.32 + .6 * (P.n - d) / P.n); e.style.width = px(w); e.style.height = px(dh * .92); e.style.setProperty('--c', PAL[d % PAL.length]); e.innerHTML = artOr('ring-' + COLN[d % COLN.length] + '.webp', '', 'full'); return e; });
      C.ui.hits = [...Array(P.k).keys()].map(p => { const h = mk(C.el, 'hit'); h.dataset.peg = p; place(h, p * colW, 0, colW, G.H); return h; });
      if (!C.ui.bound) { C.ui.bound = true; C.el.addEventListener('pointerdown', e => { const h = e.target.closest('[data-peg]'); if (h) tap(C, +h.dataset.peg); }); }
    },
    draw(C) {
      const P = C.P, G = C.ui.g; if (!G) return; const h = [...Array(P.k)].map(() => 0);
      for (let d = 0; d < P.n; d++) {
        const p = C.S.p[d], e = C.ui.discs[d], w = parseFloat(e.style.width), lift = C.x.sel === p && ENG.hanoi.top(C.S, p) === d;
        const y = lift ? G.base - G.dh * (P.n + 1.9) : G.base - G.dh * (h[p] + 1); h[p]++;
        place(e, (p + .5) * G.colW - w / 2, y); e.classList.toggle('up', lift);
      }
      C.ui.hits.forEach((x, p) => x.classList.toggle('hintPeg', C.x.hint && C.x.hint.includes(p)));
    },
    async anim(C, prev, m) {
      const [a, b] = m, d = ENG.hanoi.top(prev, a), e = C.ui.discs[d], G = C.ui.g, w = parseFloat(e.style.width);
      C.x.sel = -1; const x0 = parseFloat(e.style.left), y0 = parseFloat(e.style.top), ly = G.base - G.dh * (C.P.n + 1.9);
      const nOn = C.S.p.filter(x => x === b).length, x2 = (b + .5) * G.colW - w / 2, y2 = G.base - G.dh * nOn;
      beep('lift'); await anim(e, [{ left: px(x0), top: px(y0) }, { left: px(x0), top: px(ly), offset: .3 }, { left: px(x2), top: px(ly), offset: .7 }, { left: px(x2), top: px(y2) }], 380).then(a2 => { place(e, x2, y2); if (a2) try { a2.cancel(); } catch (er) {} });
      beep('drop', nOn); R.draw(C);
    },
    hintShow(C, m) { C.x.hint = m; C.x.sel = m[0]; R.draw(C); status(T('hanoiHint'), 1600); },
    hintClear(C) { if (C.x) C.x.hint = null; if (C.ui && C.ui.hits) C.ui.hits.forEach(x => x.classList.remove('hintPeg')); },
    pills(C) { return '<span class="pill">⭐ ' + T('toStar') + '</span>'; },
    intro(C) { if (C.i < 3) status(T('hanoiGoal'), 3000); }
  };
  function tap(C, p) {
    if (C !== CUR || C.busy || C.over) return;
    if (C.x.sel < 0) { if (ENG.hanoi.top(C.S, p) < 0) { beep('err'); return; } C.x.sel = p; beep('lift'); R.draw(C); return; }
    if (C.x.sel === p) { C.x.sel = -1; beep('drop', 0); R.draw(C); return; }
